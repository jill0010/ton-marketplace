[package]
name = "marketplace"
description = "A TON blockchain project"
version = "0.1.0"
license = "MIT"

[toolchain]
acton = "1.2.1"

[contracts.Empty]
display-name = "Empty"
src = "contracts/Empty.tolk"
depends = []

[test]

[fmt]
width = 100
ignore = []

[scripts]
deploy-emulation = "acton script scripts/deploy.tolk"
deploy-testnet = "acton script scripts/deploy.tolk --net testnet"
deploy-v2-emulation = "acton script scripts/deploy-v2.tolk"
deploy-v2-testnet = "acton script scripts/deploy-v2.tolk --net testnet"
deploy-v2-mainnet = "acton script scripts/deploy-v2.tolk --net mainnet"
deploy-v2-mainnet-tonconnect = "acton script scripts/deploy-v2.tolk --net mainnet --tonconnect"

[import-mappings]
acton = ".acton"
contracts = "contracts"
gen = "gen"
tests = "tests"
wrappers = "wrappers"


[contracts.Marketplace]
display-name = "Marketplace"
src = "contracts/Marketplace.tolk"
depends = []

[contracts.NFTEscrow]
display-name = "NFT Escrow"
src = "contracts/NFTEscrow.tolk"
depends = []
[contracts.MockNFTItem]
display-name = "Mock NFT Item"
src = "contracts/MockNFTItem.tolk"
depends = []

[contracts.RejectingNFTItem]
display-name = "Test-only Rejecting NFT Item"
src = "contracts/RejectingNFTItem.tolk"
depends = []

[contracts.NFTEscrowV2]
display-name = "NFT Escrow V2 (isolated release lifecycle)"
src = "contracts/NFTEscrowV2.tolk"
depends = []

[contracts.RejectingMarketplaceCallback]
display-name = "Test-only Rejecting Marketplace Callback"
src = "contracts/RejectingMarketplaceCallback.tolk"
depends = []

[contracts.MarketplaceV2]
display-name = "Marketplace V2 (isolated listing integration)"
src = "contracts/MarketplaceV2.tolk"
depends = []


[contracts.TestReserveVault]
display-name = "Experimental test reserve vault"
src = "contracts/TestReserveVault.tolk"
depends = []
