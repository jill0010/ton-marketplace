name: Discover Existing V3 Testnet Transfers (Read Only)

on:
  workflow_dispatch:
    inputs:
      source:
        description: Public testnet sending contract address
        required: true
        type: string
      recipient:
        description: Public testnet receiving address
        required: true
        type: string
      amount_nano:
        description: Exact transfer value in nanotons
        required: true
        type: string

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts/marketplace
    env:
      V3_SOURCE_ADDRESS: ${{ inputs.source }}
      V3_RECIPIENT_ADDRESS: ${{ inputs.recipient }}
      V3_AMOUNT_NANO: ${{ inputs.amount_nano }}
    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Test discovery parser
        run: node --test scripts/discover-v3-testnet-transfers.test.mjs
      - name: Discover exact outbound message candidates (no signer, no transfers)
        run: node scripts/discover-v3-testnet-transfers.mjs
