name: S07-09 Product 2 Order 1 Final Settlement (Testnet Only)
on:
  workflow_dispatch:
    inputs:
      confirm_order_1_settlement_only:
        description: "Authorize ONE 3-of-3 reserve receipt attestation for current Product 2 / Order 1; NO purchase, listing or deployment."
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: s07-09-product2-order1-final-settlement
  cancel-in-progress: false
jobs:
  settle:
    if: ${{ inputs.confirm_order_1_settlement_only == true && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: contracts/marketplace
    env:
      DEPLOYER_MNEMONIC: ${{ secrets.TESTNET_DEPLOYER_MNEMONIC }}
      SELLER_MNEMONIC: ${{ secrets.TESTNET_SELLER_MNEMONIC }}
      BUYER_MNEMONIC: ${{ secrets.TESTNET_SELLER_MNEMONIC }}
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
      V3_VALIDATOR_0_SEED: ${{ secrets.V3_VALIDATOR_0_SEED }}
      V3_VALIDATOR_1_SEED: ${{ secrets.V3_VALIDATOR_1_SEED }}
      V3_VALIDATOR_2_SEED: ${{ secrets.V3_VALIDATOR_2_SEED }}
      V3_TESTNET_DEPLOYER_ADDRESS: "0QDQEewIr69mGcq6uDIlAtibxW37gm7rJfKWru7o4_hSPbzu"
      PLATFORM_TREASURY_ADDRESS: "0QASRB4XGtN81Pwaef6fWnSJyRwwJEvbbPn-ksz0KQI-bFa0"
      V3_PRODUCTION_TESTNET_MARKETPLACE_ADDRESS: "kQCjpxlAc67afGlrC27CGbZzQxjOg8ME42URSFyY3aEL5gCg"
      V3_PRODUCTION_TESTNET_ESCROW_ADDRESS: "kQBxNyuqr-Ab5_LUzCc6KsXUEN9Q7vGT-HlDslDvBEuEDLK8"
      V3_PRODUCTION_TESTNET_COORDINATOR_ADDRESS: "kQCUs3jh8gTQtlAE3FgLVsiM5_j9TOTLKZUJgqacUFiO5_je"
      V3_PRODUCTION_TESTNET_VERIFIER_ADDRESS: "kQALNPtOZ5AIkaEwf4hoDTdJwgVttAwDq2ONZwuJTTzrZy-k"
      V3_TESTNET_FIXTURE_NFT_ADDRESS: "0:24ef755d50c766fc7f5160b3557e31da1007c30be7d59b6b386dcfd7ebaf5764"
      V3_TESTNET_ORDER_ID: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feature/reserve-refund-v3-audit
          persist-credentials: false
      - name: Block duplicate attestation attempts
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          previous="$(gh api "repos/${{ github.repository }}/actions/workflows/s07-09-product-2-final-settlement.yml/runs?event=workflow_dispatch&per_page=100" --jq ".workflow_runs | map(select(.id != ${GITHUB_RUN_ID})) | length")"
          test "$previous" = "0" || { echo "::error::Prior attestation attempt exists. Inspect chain, do not blindly retry."; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e
      - name: Verify exact current Product 2 purchase and isolated Vault (read-only)
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_MNEMONIC" && test -n "$SELLER_MNEMONIC" && test -n "$TONCENTER_API_KEY"
          for key in V3_VALIDATOR_0_SEED V3_VALIDATOR_1_SEED V3_VALIDATOR_2_SEED; do
            [[ "${!key:-}" =~ ^[0-9a-fA-F]{64}$ ]]
          done
          umask 077
          cat > wallets.toml <<'WALLETS'
          [wallets.deployer]
          kind = "v5r1"
          workchain = 0
          keys = { mnemonic-env = "DEPLOYER_MNEMONIC" }
          [wallets.treasury]
          kind = "v5r1"
          mnemonic-scheme = "bip39"
          workchain = 0
          keys = { mnemonic-env = "SELLER_MNEMONIC" }
          WALLETS
          chmod 600 wallets.toml
          acton script scripts/check-v3-production-testnet-wallets.tolk --net testnet
          acton script scripts/verify-v3-production-testnet-purchase.tolk --net testnet 2>&1 | tee s07-09-final-preflight.log
          grep -Fq 'V3_TESTNET_PRODUCT_ID: 2' s07-09-final-preflight.log
          grep -Fq 'V3_TESTNET_ORDER_ID: 1' s07-09-final-preflight.log
          grep -Fq 'V3_TESTNET_VAULT_ADDRESS: kQCFPrbZgKoPgZlBCmWDxWgyfHJdS18-rvkE-PkrzlCcGRu_' s07-09-final-preflight.log
          grep -Fq 'Reserve is in-flight pending actual buyer receipt attestation' s07-09-final-preflight.log
      - name: Install existing attestor and run its tests
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s07-09-attestor"
          npm install --prefix "$RUNNER_TEMP/s07-09-attestor" --ignore-scripts --no-audit --no-fund --save-exact @ton/core@0.63.1 @ton/ton@16.3.0 @ton/crypto@3.3.0
          cp contracts/marketplace/scripts/attest-v3-testnet-reserve-refund.mjs "$RUNNER_TEMP/s07-09-attestor/attest.mjs"
          cp contracts/marketplace/scripts/attest-v3-testnet-reserve-refund.test.mjs "$RUNNER_TEMP/s07-09-attestor/attest.test.mjs"
          node --test "$RUNNER_TEMP/s07-09-attestor/attest.test.mjs"
      - name: Verify independent receipts and submit 3-of-3 settlement attestation ONCE
        working-directory: .
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/s07-09-attestor/attest.mjs" 2>&1 | tee contracts/marketplace/s07-09-final-attestation.log
          grep -Fq '"orderId": "1"' contracts/marketplace/s07-09-final-attestation.log
          grep -Fq '"vaultStatus": 3' contracts/marketplace/s07-09-final-attestation.log
          grep -Fq '"paidNano": "200000000"' contracts/marketplace/s07-09-final-attestation.log
      - name: Verify completed on-chain settlement (read-only)
        run: |
          set -euo pipefail
          acton script scripts/verify-v3-production-testnet-settlement.tolk --net testnet 2>&1 | tee s07-09-final-settlement.log
          grep -Fq 'PRODUCTION V3 TESTNET ON-CHAIN STATE CHECK PASSED' s07-09-final-settlement.log
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s07-09-product2-final-settlement-${{ github.run_id }}
          path: |
            contracts/marketplace/s07-09-final-preflight.log
            contracts/marketplace/s07-09-final-attestation.log
            contracts/marketplace/s07-09-final-settlement.log
          if-no-files-found: ignore
      - name: Delete temporary wallet profile
        if: always()
        run: rm -f wallets.toml
