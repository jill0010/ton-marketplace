name: Frontend Build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/test-marketplace-v3-preflight.mjs"
      - "supabase/functions/marketplace-v3-testnet-readonly/**"
      - "supabase/functions/_shared/marketplace-v3-testnet-getter.*"
      - "scripts/check-marketplace-v2-customer-purchase-policy.mjs"
      - "scripts/check-marketplace-v2-order-mirror-truthfulness.mjs"
      - "supabase/functions/marketplace-v2-state/**"
      - "supabase/functions/admin-marketplace-orders/**"
      - "supabase/functions/marketplace-order-history/**"
      - "supabase/functions/_shared/marketplace-processing-reserve.*"
      - "supabase/functions/_shared/marketplace-v2-buy-message.*"
      - "supabase/functions/_shared/marketplace-v2-chain-observation.*"
      - "supabase/functions/admin-preview-marketplace-processing-reserve/**"
      - "supabase/functions/admin-observe-marketplace-v2/**"
      - "supabase/functions/admin-resolve-marketplace-v2-payment-root/**"
      - "supabase/functions/_shared/marketplace-v2-parent-transaction.*"
      - "supabase/functions/_shared/marketplace-v2-order-cell.*"
      - "supabase/functions/_shared/marketplace-v2-order-get-method.*"
      - "supabase/functions/admin-inspect-marketplace-v2-order/**"
      - "supabase/functions/_shared/marketplace-v2-payment-verification.*"
      - "supabase/functions/admin-verify-marketplace-v2-payment/**"
      - "supabase/functions/_shared/marketplace-v2-indexer-request.*"
      - "supabase/migrations/20261106024206_add_marketplace_processing_reserve_ledger.sql"
      - "supabase/migrations/20261106024422_lock_marketplace_processing_reserve_privileges.sql"
      - "scripts/check-marketplace-v2-processing-reserve-ledger.mjs"
      - "scripts/check-marketplace-v2-payment-verifier-readonly.mjs"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.*"
      - "tsconfig*.json"
      - "postcss.config.*"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/check-marketplace-v2-customer-purchase-policy.mjs"
      - "scripts/check-marketplace-v2-order-mirror-truthfulness.mjs"
      - "scripts/check-marketplace-v2-processing-reserve-ledger.mjs"
      - "scripts/check-marketplace-v2-payment-verifier-readonly.mjs"
      - "supabase/functions/admin-resolve-marketplace-v2-payment-root/**"
      - "supabase/functions/marketplace-v2-state/**"
      - "supabase/functions/admin-marketplace-orders/**"
      - "supabase/functions/marketplace-order-history/**"
      - "supabase/functions/_shared/marketplace-processing-reserve.*"
      - "supabase/functions/admin-preview-marketplace-processing-reserve/**"
      - "supabase/functions/admin-observe-marketplace-v2/**"
      - "supabase/functions/_shared/marketplace-v2-indexer-request.*"
      - "supabase/functions/_shared/marketplace-v2-buy-message.*"
      - "supabase/functions/_shared/marketplace-v2-chain-observation.*"
      - "supabase/functions/_shared/marketplace-v2-parent-transaction.*"
      - "supabase/functions/_shared/marketplace-v2-order-cell.*"
      - "supabase/functions/_shared/marketplace-v2-order-get-method.*"
      - "supabase/functions/admin-inspect-marketplace-v2-order/**"
      - "supabase/functions/_shared/marketplace-v2-payment-verification.*"
      - "supabase/functions/admin-verify-marketplace-v2-payment/**"
      - "supabase/migrations/20261106024206_add_marketplace_processing_reserve_ledger.sql"
      - "supabase/migrations/20261106024422_lock_marketplace_processing_reserve_privileges.sql"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.*"
      - "tsconfig*.json"
      - "postcss.config.*"
      - ".github/workflows/frontend-build.yml"

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript and Vite production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install pinned Deno from npm registry
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Release downloads used by setup-deno repeatedly return HTTP 504.
          # The npm distribution supplies a platform-specific Deno binary.
          for attempt in 1 2 3; do
            if npm install --global --no-audit --no-fund deno@2.6.4; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Pinned Deno installation failed after three attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          deno --version
          test "$(deno --version | head -n 1)" = "deno 2.6.4 (stable, release, x86_64-unknown-linux-gnu)" || deno --version | head -n 1 | grep -Eq '^deno 2\\.6\\.4([[:space:]]|$)'

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify Marketplace V2 customer purchase remains gated
        run: node scripts/check-marketplace-v2-customer-purchase-policy.mjs

      - name: Verify Marketplace V2 order mirror truthfulness
        run: node scripts/check-marketplace-v2-order-mirror-truthfulness.mjs

      - name: Verify Marketplace V2 processing reserve ledger schema
        run: node scripts/check-marketplace-v2-processing-reserve-ledger.mjs

      - name: Verify Marketplace V2 payment verifier remains read-only
        run: node scripts/check-marketplace-v2-payment-verifier-readonly.mjs

      - name: Test Marketplace V2 processing reserve fee reconciliation
        run: node --test supabase/functions/_shared/marketplace-processing-reserve.test.mjs

      - name: Type-check processing reserve preview Edge Function
        run: deno check --config supabase/functions/deno.json supabase/functions/admin-preview-marketplace-processing-reserve/index.ts

      - name: Test strict Marketplace V2 purchase message validation
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared/marketplace-v2-buy-message.test.ts

      - name: Type-check Marketplace V2 purchase message validator
        run: deno check --config supabase/functions/deno.json supabase/functions/_shared/marketplace-v2-buy-message.ts

      - name: Test finalized Marketplace V2 chain observations
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared/marketplace-v2-chain-observation.test.ts

      - name: Type-check Marketplace V2 chain observation parser
        run: deno check --config supabase/functions/deno.json supabase/functions/_shared/marketplace-v2-chain-observation.ts

      - name: Test bounded Marketplace V2 indexer pagination
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared/marketplace-v2-indexer-request.test.ts

      - name: Type-check Marketplace V2 read-only observer
        run: deno check --config supabase/functions/deno.json supabase/functions/admin-observe-marketplace-v2/index.ts

      - name: Test buyer wallet root transaction linkage
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared/marketplace-v2-parent-transaction.test.ts

      - name: Test Marketplace V2 order cell decoding
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared/marketplace-v2-order-cell.test.ts
      - name: Type-check Marketplace V2 order cell decoder
        run: deno check --config supabase/functions/deno.json supabase/functions/_shared/marketplace-v2-order-cell.ts
      - name: Type-check admin payment root resolver
        run: deno check --config supabase/functions/deno.json supabase/functions/admin-resolve-marketplace-v2-payment-root/index.ts

      - name: Test Marketplace V2 order get-method response decoding
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared/marketplace-v2-order-get-method.test.ts

      - name: Type-check Marketplace V2 order get-method decoder
        run: deno check --config supabase/functions/deno.json supabase/functions/_shared/marketplace-v2-order-get-method.ts

      - name: Type-check admin Marketplace V2 order inspection
        run: deno check --config supabase/functions/deno.json supabase/functions/admin-inspect-marketplace-v2-order/index.ts

      - name: Test Marketplace V2 payment trace and order identity verification
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared/marketplace-v2-payment-verification.test.ts

      - name: Type-check Marketplace V2 payment verification
        run: deno check --config supabase/functions/deno.json supabase/functions/_shared/marketplace-v2-payment-verification.ts

      - name: Type-check admin Marketplace V2 payment verifier
        run: deno check --config supabase/functions/deno.json supabase/functions/admin-verify-marketplace-v2-payment/index.ts

      - name: Test strict V3 Testnet getter decoding
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared/marketplace-v3-testnet-getter.test.ts

      - name: Type-check V3 Testnet getter parser
        run: deno check --config supabase/functions/deno.json supabase/functions/_shared/marketplace-v3-testnet-getter.ts

      - name: Type-check V3 Testnet read-only RPC Edge Function
        run: deno check --config supabase/functions/deno.json supabase/functions/marketplace-v3-testnet-readonly/index.ts

      - name: Test Marketplace V3 Testnet purchase preflight (no transactions)
        run: node --test scripts/test-marketplace-v3-preflight.mjs

      - name: Build production frontend
        run: npm run build
