name: S05 Diagnose NFT Transfer Timeout (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feature/reserve-refund-v3-audit
          persist-credentials: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Inspect testnet deployer and NFT transaction history
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        run: node scripts/s05-diagnose-transfer-testnet-readonly.mjs
