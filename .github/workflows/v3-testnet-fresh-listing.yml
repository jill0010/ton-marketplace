name: V3 Testnet Fresh NFT Listing (No Purchase)

on:
  workflow_dispatch:
    inputs:
      confirm_testnet_listing_only:
        description: "Create ONE fresh synthetic NFT and list it on existing TON TESTNET V3; no purchase or Mainnet."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: v3-testnet-fresh-listing
  cancel-in-progress: false

jobs:
  list:
    if: ${{ inputs.confirm_testnet_listing_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: contracts/marketplace
    env:
      DEPLOYER_MNEMONIC: ${{ secrets.TESTNET_DEPLOYER_MNEMONIC }}
      SELLER_MNEMONIC: ${{ secrets.TESTNET_SELLER_MNEMONIC }}
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
      V3_TESTNET_DEPLOYER_ADDRESS: "0QDQEewIr69mGcq6uDIlAtibxW37gm7rJfKWru7o4_hSPbzu"
      PLATFORM_TREASURY_ADDRESS: "0QASRB4XGtN81Pwaef6fWnSJyRwwJEvbbPn-ksz0KQI-bFa0"
      V3_PRODUCTION_TESTNET_MARKETPLACE_ADDRESS: "kQB9Q03obJYKG84bfXFrpL6OtUcX41z54A3m4LFGf_0a14D_"
      V3_PRODUCTION_TESTNET_ESCROW_ADDRESS: "kQAp5SqhqBj1LK3q9mHpBDsVzUnMyWBiH-nvtTB7q0vdP0mG"
      V3_TESTNET_FIXTURE_ENABLED: "true"
      FIXTURE_EMULATION: "false"
    steps:
      - name: Checkout proven testnet fixture code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 223cebcd0977d90486c71417645a6fe2cbaa4953
          persist-credentials: false
      - name: Validate Testnet-only inputs and isolated fixture index
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_MNEMONIC" && test -n "$SELLER_MNEMONIC" && test -n "$TONCENTER_API_KEY"
          test "$V3_TESTNET_FIXTURE_ENABLED" = true
          test "$FIXTURE_EMULATION" = false
          test "$V3_PRODUCTION_TESTNET_MARKETPLACE_ADDRESS" = "kQB9Q03obJYKG84bfXFrpL6OtUcX41z54A3m4LFGf_0a14D_"
          test "$V3_PRODUCTION_TESTNET_ESCROW_ADDRESS" = "kQAp5SqhqBj1LK3q9mHpBDsVzUnMyWBiH-nvtTB7q0vdP0mG"
          echo "V3_TESTNET_FIXTURE_ITEM_INDEX=$((1000000000 + GITHUB_RUN_ID))" >> "$GITHUB_ENV"
      - name: Setup Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e
      - name: Create ephemeral Testnet wallet profiles
        shell: bash
        run: |
          set -euo pipefail
          cat > wallets.toml <<'WALLETS'
          [wallets.deployer]
          kind = "v5r1"
          workchain = 0
          keys = { mnemonic-env = "DEPLOYER_MNEMONIC" }

          [wallets.treasury]
          kind = "v5r1"
          mnemonic-scheme = "bip39"
          workchain = 0
          keys = { mnemonic-env = "SELLER_MNEMONIC" }
          WALLETS
          chmod 600 wallets.toml
          acton script scripts/check-v3-production-testnet-wallets.tolk --net testnet
      - name: Build fixture and production contract wrappers
        run: acton build
      - name: Create and list ONE fresh synthetic NFT on Testnet
        shell: bash
        run: |
          set -euo pipefail
          acton script scripts/run-v3-production-testnet-fixture.tolk --net testnet 2>&1 | tee v3-fresh-listing.log
          grep -Fq "V3 Testnet synthetic TEP-62 fixture listed and NFT custody verified." v3-fresh-listing.log
          grep -Fq "Product ID:" v3-fresh-listing.log
          grep -Fq "V3_TESTNET_FIXTURE_NFT_ADDRESS:" v3-fresh-listing.log
          {
            echo "## Fresh V3 Testnet listing"
            echo
            grep -E '^(Product ID:|NFT Item:|Escrow ID:|V3_TESTNET_FIXTURE_NFT_ADDRESS:)' v3-fresh-listing.log
            echo
            echo "This is a funded TESTNET listing, NOT a purchase. No Mainnet transaction was made."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve fresh listing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-fresh-listing-${{ github.run_id }}
          path: contracts/marketplace/v3-fresh-listing.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Delete ephemeral wallet profiles
        if: always()
        run: rm -f wallets.toml
