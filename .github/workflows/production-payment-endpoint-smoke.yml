name: Production Payment Endpoint Security Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-payment-endpoint-smoke.yml"
      - "supabase/functions/verify-manual-product-payment/**"
permissions:
  contents: read
jobs:
  public-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public endpoint denies unauthenticated calls
        env:
          ENDPOINT: https://qmvvlkierfiogituccbo.supabase.co/functions/v1/verify-manual-product-payment
        run: |
          set -euo pipefail
          for method in GET POST; do
            status=$(curl --silent --show-error --output /tmp/payment-smoke-body --write-out '%{http_code}' --max-time 20 -X "$method" -H 'Origin: https://ton-marketplace-cvj.pages.dev' -H 'Content-Type: application/json' --data '{}' "$ENDPOINT")
            echo "$method unauthenticated HTTP status: $status"
            if [[ "$status" != 401 && "$status" != 403 ]]; then
              echo "FAIL: unauthenticated payment verification endpoint did not reject the request"
              cat /tmp/payment-smoke-body
              exit 1
            fi
          done
          # Invalid credentials must not bypass the JWT gateway.
          status=$(curl --silent --show-error --output /tmp/payment-smoke-body --write-out '%{http_code}' --max-time 20 -X POST -H 'Origin: https://ton-marketplace-cvj.pages.dev' -H 'Authorization: Bearer definitely-not-a-valid-jwt' -H 'Content-Type: application/json' --data '{"order_id":"00000000-0000-4000-8000-000000000001"}' "$ENDPOINT")
          echo "POST malformed bearer HTTP status: $status"
          if [[ "$status" != 401 && "$status" != 403 ]]; then
            echo "FAIL: malformed bearer token was accepted"
            exit 1
          fi
          # Requests from an unapproved browser origin must fail before order access.
          status=$(curl --silent --show-error --output /tmp/payment-smoke-body --write-out '%{http_code}' --max-time 20 -X POST -H 'Origin: https://untrusted.example' -H 'Content-Type: application/json' --data '{}' "$ENDPOINT")
          echo "POST unapproved origin HTTP status: $status"
          if [[ "$status" != 403 && "$status" != 401 ]]; then
            echo "FAIL: unapproved origin was not rejected"
            exit 1
          fi
          echo "PASS: production endpoint rejects missing authorization, malformed tokens and unapproved origins."
