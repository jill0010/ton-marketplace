name: S05 Read-only Testnet Deployment Recovery
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Inspect S05 deployer transactions (read-only, no wallet secrets)
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const deployer = "0QDQEewIr69mGcq6uDIlAtibxW37gm7rJfKWru7o4_hSPbzu";
          const base = "https://testnet.toncenter.com/api/v2/";
          const headers = process.env.TONCENTER_API_KEY ? {"X-API-Key":process.env.TONCENTER_API_KEY} : {};
          async function get(method,params) {
            const url = new URL(method,base);
            for(const [k,v] of Object.entries(params)) url.searchParams.set(k,String(v));
            for(let attempt=1;attempt<=4;attempt++) {
              try {
                const response=await fetch(url,{headers,signal:AbortSignal.timeout(20000)});
                if(!response.ok) throw Error(method+" HTTP "+response.status);
                const body=await response.json();
                if(body.ok!==true) throw Error(method+" API error "+JSON.stringify(body.error??body.description));
                return body.result;
              } catch(error) {
                if(attempt===4 || !/HTTP (429|500|502|503|504|542)|timeout|fetch failed/i.test(String(error))) throw error;
                console.warn("RPC temporary failure, attempt",attempt,":",String(error));
                await new Promise(resolve=>setTimeout(resolve,attempt*1500));
              }
            }
          }

          const start=Date.parse("2026-11-15T14:04:40Z")/1000;
          const end=Date.parse("2026-11-15T14:06:30Z")/1000;
          const transactions=[];
          let cursor;
          for(let page=0;page<20;page++){
            const params={address:deployer,limit:10};
            if(cursor) {params.lt=cursor.lt;params.hash=cursor.hash;}
            const batch=await get("getTransactions",params);
            if(!Array.isArray(batch)) throw Error("getTransactions did not return an array");
            transactions.push(...batch);
            console.log("Read-only page",page+1,"size",batch.length);
            if(batch.length<10 || batch.some(tx=>tx.utime<start-120)) break;
            const last=batch.at(-1)?.transaction_id;
            if(!last?.lt || !last?.hash) throw Error("Missing transaction cursor");
            cursor=last;
          }
          const relevant=transactions.filter(tx=>tx.utime>=start-120&&tx.utime<=end+120);
          console.log("Scanned",transactions.length,"recent transactions; relevant",relevant.length);
          let found=0;
          for(const tx of relevant){
            const messages=tx.out_msgs??[];
            for(const msg of messages){
              const dest=msg.destination;
              if(!dest) continue;
              const info=await get("getAddressInformation",{address:dest});
              const isDeploy=!!msg.init_state;
              console.log(JSON.stringify({txTime:new Date(tx.utime*1000).toISOString(),walletTx:tx.transaction_id?.hash,destination:dest,value:msg.value,hasInitState:isDeploy,accountState:info.state,accountCodeHash:info.code_hash??null}));
              if(isDeploy) found++;
            }
          }
          console.log("Outbound messages carrying state init:",found);
          console.log("Read-only evidence only. A zero count is NOT proof that no deployment was broadcast.");
          JS

      - name: Verify candidate Collection address and inbound deployment transaction
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const address="EQABD-C8AWc8PnlrsZYg-aDWrB3MhsB0etXI91KO6lZs3KO4";
          const deployer="0QDQEewIr69mGcq6uDIlAtibxW37gm7rJfKWru7o4_hSPbzu";
          const headers={"X-API-Key":process.env.TONCENTER_API_KEY};
          async function get(method,params){
            const url=new URL("https://testnet.toncenter.com/api/v2/"+method);
            for(const [key,value] of Object.entries(params))url.searchParams.set(key,String(value));
            for(let attempt=1;attempt<=4;attempt++){
              try{
                const res=await fetch(url,{headers,signal:AbortSignal.timeout(20000)});
                if(!res.ok)throw Error("HTTP "+res.status);
                const body=await res.json();
                if(!body.ok)throw Error(JSON.stringify(body));
                return body.result;
              }catch(error){
                if(attempt===4||!/429|500|502|503|504|542|timeout|fetch failed/i.test(String(error)))throw error;
                await new Promise(resolve=>setTimeout(resolve,attempt*1500));
              }
            }
          }
          const state=await get("getAddressInformation",{address});
          console.log("CANDIDATE_ADDRESS:",address);
          console.log("CANDIDATE_STATE:",state.state);
          console.log("CANDIDATE_CODE_PRESENT:",Boolean(state.code));
          const txs=await get("getTransactions",{address,limit:10});
          for(const tx of txs){
            console.log("CANDIDATE_TX:",JSON.stringify({time:new Date(tx.utime*1000).toISOString(),hash:tx.transaction_id?.hash,source:tx.in_msg?.source,value:tx.in_msg?.value,description:tx.description?.type??null}));
          }
          const deploy=txs.find(tx=>tx.in_msg?.value==="2500000000"&&tx.utime>=Date.parse("2026-11-15T14:04:00Z")/1000&&tx.utime<=Date.parse("2026-11-15T14:08:00Z")/1000);
          console.log("MATCHING_DEPLOYMENT_INBOUND:",Boolean(deploy));
          console.log("EXPECTED_DEPLOYER:",deployer);
          if(state.state!=="active"||!state.code||!deploy)throw Error("Candidate not sufficiently verified; do not mint or redeploy");
          const getUrl="https://testnet.toncenter.com/api/v2/runGetMethod";
          const getBody={address,method:"get_nft_address_by_index",stack:[["num","1"]]};
          let getter;
          for(let attempt=1;attempt<=4;attempt++){
            try{
              const response=await fetch(getUrl,{method:"POST",headers:{...headers,"Content-Type":"application/json"},body:JSON.stringify(getBody),signal:AbortSignal.timeout(20000)});
              if(!response.ok)throw Error("runGetMethod HTTP "+response.status);
              const result=await response.json();
              if(!result.ok)throw Error("runGetMethod API "+JSON.stringify(result.error));
              getter=result.result;
              break;
            }catch(error){
              if(attempt===4||!/429|500|502|503|504|542|timeout|fetch failed/i.test(String(error)))throw error;
              await new Promise(resolve=>setTimeout(resolve,attempt*1500));
            }
          }
          console.log("S05_GETTER_EXIT_CODE:",getter.exit_code);
          console.log("S05_GETTER_STACK:",JSON.stringify(getter.stack));
          if(getter.exit_code!==0)throw Error("S05 Collection getter not verified; do not mint or redeploy");
          console.log("S05_CANDIDATE_COLLECTION_GETTER_VERIFIED: true");
          JS

      - name: Install dependencies for S05 post-mint read-only verification
        run: npm ci

      - name: Inspect Collection minted flag, Item activation and NFT getter (no broadcast)
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        run: node scripts/s05-post-mint-readonly.mjs
