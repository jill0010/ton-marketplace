name: S07 Deploy Production Escrow V2 to Testnet and Verify

on:
  workflow_dispatch:
    inputs:
      confirm_testnet_deployment:
        description: "Deploy production-code Escrow V2 on TON Testnet (spends testnet TON only)"
        required: true
        type: boolean
        default: false
      marketplace_address:
        description: "Testnet Marketplace address to bind (must be independently verified)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: s07-production-escrow-testnet
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_testnet_deployment == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts/marketplace
    env:
      DEPLOYER_MNEMONIC: ${{ secrets.TESTNET_DEPLOYER_MNEMONIC }}
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
      S07_TESTNET_ESCROW_DEPLOY_ENABLED: "true"
      S07_TESTNET_MARKETPLACE_ADDRESS: ${{ inputs.marketplace_address }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e
      - name: Configure testnet-only deployer
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_MNEMONIC" || { echo "::error::Missing testnet deployer secret"; exit 1; }
          test -n "$S07_TESTNET_MARKETPLACE_ADDRESS" || exit 1
          cat > wallets.toml <<'WALLETS'
          [wallets.deployer]
          kind = "v5r1"
          workchain = 0
          keys = { mnemonic-env = "DEPLOYER_MNEMONIC" }
          WALLETS
          chmod 600 wallets.toml
      - name: Build contracts
        run: acton build
      - name: Deploy isolated production-code Escrow on testnet
        shell: bash
        run: |
          set -euo pipefail
          acton script scripts/deploy-s07-production-escrow-testnet.tolk --net testnet 2>&1 | tee s07-escrow-deploy.log
          grep -Fq "S07 deployment and getters succeeded" s07-escrow-deploy.log
          grep -F "S07_TESTNET_PRODUCTION_ESCROW_ADDRESS=" s07-escrow-deploy.log >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve testnet deployment log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s07-production-escrow-testnet-deployment
          path: contracts/marketplace/s07-escrow-deploy.log
          if-no-files-found: ignore
          retention-days: 30
