name: Verify Testnet Seller BIP39
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install isolated address derivation dependencies without secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seller-address-check"
          cp scripts/check-testnet-seller-bip39.mjs "$RUNNER_TEMP/seller-address-check/check.mjs"
          cd "$RUNNER_TEMP/seller-address-check"
          npm install --ignore-scripts --no-audit --no-fund --save-exact @ton/ton@16.3.0 @ton/core@0.63.1 @ton/crypto@3.3.0 bip39@3.1.0 ed25519-hd-key@1.3.0
      - name: Derive public addresses and verify expected Testnet seller (offline)
        env:
          SELLER_MNEMONIC: ${{ secrets.TESTNET_SELLER_MNEMONIC }}
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/seller-address-check/check.mjs" | tee "$RUNNER_TEMP/seller-address-result.log"
          {
            echo "## Testnet seller BIP39 address verification"
            grep -E "^MATCH:|^Expected seller address verified" "$RUNNER_TEMP/seller-address-result.log"
            echo "No signature, transaction, deployment, NFT transfer or chain RPC request was made."
            echo "The existing Acton 1.2.1 listing signer remains incompatible until separately adapted."
          } >> "$GITHUB_STEP_SUMMARY"
