name: Finalize Existing V3 Testnet Order 3 (RETIRED - Read Only)

# Historical settlement completed in run 42479121408.
# Never replay validator attestations for an already-paid order.
# To inspect current state, use v3-order-3-settlement-readonly.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report completed settlement without signing or sending transactions
        shell: bash
        run: |
          {
            echo "## Retired: order 3 already settled"
            echo
            echo "- Historical settlement evidence: run 42479121408."
            echo "- Independent Testnet read-only verification: run 42480145497."
            echo "- Repeating attestation is prohibited."
            echo "- For updated evidence run V3 Order 3 Settlement Evidence (Read Only)."
            echo "- No wallet keys, validator seeds, or RPC credentials are loaded."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Order 3 settlement already completed; this workflow is retired."
