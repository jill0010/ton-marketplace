name: V3 Testnet On-chain Postflight (Read Only)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-v3-testnet-deployed-code.mjs'
      - 'scripts/verify-v3-testnet-deployed-code.test.mjs'
      - '.github/workflows/v3-testnet-onchain-postflight.yml'
  workflow_dispatch:
    inputs:
      marketplace_address:
        description: "Production V3 Testnet marketplace (historical product-4 purchase)"
        default: "kQB9Q03obJYKG84bfXFrpL6OtUcX41z54A3m4LFGf_0a14D_"
        required: true
        type: string
      escrow_address:
        description: "Production V2 Testnet escrow (historical product-4 purchase)"
        default: "kQAp5SqhqBj1LK3q9mHpBDsVzUnMyWBiH-nvtTB7q0vdP0mG"
        required: true
        type: string
      coordinator_address:
        description: "Production V3 Testnet coordinator (historical product-4 purchase)"
        default: "kQAhqpc_v-G6PDX5BavZPT0SsqmOWm9hvBomPZIJ9cOHdQop"
        required: true
        type: string

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test scripts/verify-v3-testnet-deployed-code.test.mjs
  postflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked TON verification dependencies
        run: npm ci --ignore-scripts
      - name: Verify fail-closed address validation offline
        run: node --test scripts/verify-v3-testnet-deployed-code.test.mjs
      - name: Collect and compare deployed Testnet code hashes (read only)
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
          V3_TESTNET_MARKETPLACE_ADDRESS: ${{ inputs.marketplace_address }}
          V3_TESTNET_ESCROW_ADDRESS: ${{ inputs.escrow_address }}
          V3_TESTNET_COORDINATOR_ADDRESS: ${{ inputs.coordinator_address }}
          V3_EVIDENCE_OUTPUT: v3-testnet-evidence.json
        run: node scripts/verify-v3-testnet-deployed-code.mjs
      - name: Upload evidence (including inactive-state reports)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v3-testnet-postflight-evidence
          path: v3-testnet-evidence.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Summary
        if: always()
        run: |
          echo "## V3 testnet on-chain postflight" >> "$GITHUB_STEP_SUMMARY"
          echo "Read-only RPC queries only. No wallet signing, transfers, or deployment." >> "$GITHUB_STEP_SUMMARY"
          echo "Active contract state alone does NOT approve mainnet release or real funds." >> "$GITHUB_STEP_SUMMARY"
