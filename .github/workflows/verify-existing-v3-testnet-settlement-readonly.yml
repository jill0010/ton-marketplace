name: Verify Existing Marketplace V3 Testnet Settlement (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-v3-testnet-order-1-read-only-audit
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts/marketplace
    env:
      DEPLOYER_MNEMONIC: ${{ secrets.TESTNET_DEPLOYER_MNEMONIC }}
      SELLER_MNEMONIC: ${{ secrets.TESTNET_SELLER_MNEMONIC }}
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
      V3_TESTNET_DEPLOYER_ADDRESS: "0QDQEewIr69mGcq6uDIlAtibxW37gm7rJfKWru7o4_hSPbzu"
      PLATFORM_TREASURY_ADDRESS: "0QASRB4XGtN81Pwaef6fWnSJyRwwJEvbbPn-ksz0KQI-bFa0"
      V3_PRODUCTION_TESTNET_MARKETPLACE_ADDRESS: "kQB9Q03obJYKG84bfXFrpL6OtUcX41z54A3m4LFGf_0a14D_"
      V3_PRODUCTION_TESTNET_ESCROW_ADDRESS: "kQAp5SqhqBj1LK3q9mHpBDsVzUnMyWBiH-nvtTB7q0vdP0mG"
      V3_PRODUCTION_TESTNET_COORDINATOR_ADDRESS: "kQAhqpc_v-G6PDX5BavZPT0SsqmOWm9hvBomPZIJ9cOHdQop"
      V3_PRODUCTION_TESTNET_VERIFIER_ADDRESS: "kQBBvJvEce3gr5OGIuzIaWPd7ylKeKxLw6l9saVjBTccl8Vs"
      V3_TESTNET_FIXTURE_NFT_ADDRESS: "kQAcb1ncpbbm60x5-SgPZmTXInVQKlxis5soblmYSsfXcYHm"
      V3_TESTNET_ORDER_ID: "1"
    steps:
      - name: Checkout audited read-only verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: be081edcaa7dc81e8901d6d89629e693c9f19421
          persist-credentials: false

      - name: Setup Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e # v1.2.0

      - name: Create ephemeral wallet profiles for read-only getters
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_MNEMONIC"
          test -n "$SELLER_MNEMONIC"
          cat > wallets.toml <<'WALLETS'
          [wallets.deployer]
          kind = "v5r1"
          workchain = 0
          keys = { mnemonic-env = "DEPLOYER_MNEMONIC" }

          [wallets.treasury]
          kind = "v5r1"
          mnemonic-scheme = "bip39"
          workchain = 0
          keys = { mnemonic-env = "SELLER_MNEMONIC" }
          WALLETS
          chmod 600 wallets.toml
          acton script scripts/check-v3-production-testnet-wallets.tolk --net testnet

      - name: Independently verify existing order 1 final settlement via Testnet getters
        shell: bash
        run: |
          set -euo pipefail
          acton script scripts/verify-v3-production-testnet-settlement.tolk --net testnet 2>&1 | tee v3-order-1-final-read-only-verification.log
          grep -Fq "PRODUCTION V3 TESTNET ON-CHAIN STATE CHECK PASSED" v3-order-1-final-read-only-verification.log
          grep -Fq "Vault status: paid; in-flight: 0; available: 0" v3-order-1-final-read-only-verification.log

      - name: Preserve final read-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v3-testnet-order-1-final-read-only-verification
          path: contracts/marketplace/v3-order-1-final-read-only-verification.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove ephemeral wallet profiles
        if: always()
        run: rm -f wallets.toml
