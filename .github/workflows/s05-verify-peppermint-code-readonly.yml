name: S05 Verify Peppermint Code Hash (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feature/reserve-refund-v3-audit
          persist-credentials: false
      - name: Install project dependencies
        run: npm ci --ignore-scripts
      - name: Verify on-chain NFT code and identity without transaction
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        run: node scripts/verify-s05-peppermint-code-readonly.mjs
