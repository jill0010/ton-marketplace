name: S07-09 List Compatible NFT into Existing Escrow (Testnet Only)
on:
  workflow_dispatch:
    inputs:
      confirm_compatible_nft_listing:
        description: "Approve listing verified TESTNET NFT index 1 into existing Escrow; no deployment or purchase."
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: s07-09-compatible-nft-listing
  cancel-in-progress: false
jobs:
  list:
    if: ${{ inputs.confirm_compatible_nft_listing == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: contracts/marketplace
    env:
      DEPLOYER_MNEMONIC: ${{ secrets.TESTNET_DEPLOYER_MNEMONIC }}
      SELLER_MNEMONIC: ${{ secrets.TESTNET_SELLER_MNEMONIC }}
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
      V3_TESTNET_FIXTURE_ENABLED: "true"
      S07_09_COMPATIBLE_LISTING_APPROVED: "true"
      S07_09_COMPATIBLE_NFT_ADDRESS: "0:24ef755d50c766fc7f5160b3557e31da1007c30be7d59b6b386dcfd7ebaf5764"
      V3_TESTNET_DEPLOYER_ADDRESS: "0QDQEewIr69mGcq6uDIlAtibxW37gm7rJfKWru7o4_hSPbzu"
      PLATFORM_TREASURY_ADDRESS: "0QASRB4XGtN81Pwaef6fWnSJyRwwJEvbbPn-ksz0KQI-bFa0"
      V3_PRODUCTION_TESTNET_MARKETPLACE_ADDRESS: "kQCjpxlAc67afGlrC27CGbZzQxjOg8ME42URSFyY3aEL5gCg"
      V3_PRODUCTION_TESTNET_ESCROW_ADDRESS: "kQBxNyuqr-Ab5_LUzCc6KsXUEN9Q7vGT-HlDslDvBEuEDLK8"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feature/reserve-refund-v3-audit
          persist-credentials: false
      - uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e
      - name: Configure existing testnet wallet profiles and compile
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_MNEMONIC"
          test -n "$SELLER_MNEMONIC"
          test -n "$TONCENTER_API_KEY"
          umask 077
          cat > wallets.toml <<'WALLETS'
          [wallets.deployer]
          kind = "v5r1"
          workchain = 0
          keys = { mnemonic-env = "DEPLOYER_MNEMONIC" }

          [wallets.treasury]
          kind = "v5r1"
          mnemonic-scheme = "bip39"
          workchain = 0
          keys = { mnemonic-env = "SELLER_MNEMONIC" }
          WALLETS
          chmod 600 wallets.toml
          acton build
          acton script scripts/check-v3-production-testnet-wallets.tolk --net testnet
      - name: Publish compatible NFT and verify Escrow custody
        run: |
          set -euo pipefail
          acton script scripts/s07-09-list-compatible-nft.tolk --net testnet 2>&1 | tee s07-09-compatible-listing.log
          grep -Fq 'S07_09_COMPATIBLE_NFT_LISTED_AND_CUSTODIED: true' s07-09-compatible-listing.log
          grep -Fq 'Test listing active; product ID:' s07-09-compatible-listing.log
          grep -Fq 'Test listing escrow ID:' s07-09-compatible-listing.log
          {
            echo '## S07-09 existing NFT listing and custody'
            grep -E '^(Test listing active; product ID:|Test listing escrow ID:|NFT custody verified:|S07_09_COMPATIBLE_NFT)' s07-09-compatible-listing.log
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve listing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s07-09-compatible-listing-${{ github.run_id }}
          path: contracts/marketplace/s07-09-compatible-listing.log
          if-no-files-found: ignore
      - name: Remove temporary wallet profile
        if: always()
        run: rm -f wallets.toml
