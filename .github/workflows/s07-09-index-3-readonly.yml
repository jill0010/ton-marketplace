name: S07-09 Inspect Failed Fixture Index 3 (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feature/reserve-refund-v3-audit
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e
      - name: Inspect deterministic fixture address and marketplace state
        working-directory: contracts/marketplace
        env:
          PLATFORM_TREASURY_ADDRESS: "0QASRB4XGtN81Pwaef6fWnSJyRwwJEvbbPn-ksz0KQI-bFa0"
          V3_TESTNET_DEPLOYER_ADDRESS: "0QDQEewIr69mGcq6uDIlAtibxW37gm7rJfKWru7o4_hSPbzu"
          V3_PRODUCTION_TESTNET_MARKETPLACE_ADDRESS: "kQCjpxlAc67afGlrC27CGbZzQxjOg8ME42URSFyY3aEL5gCg"
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        run: |
          set -uo pipefail
          acton build
          result=0
          acton script scripts/s07-09-inspect-fixture-index-3.tolk --net testnet > "$GITHUB_WORKSPACE/fixture-index-3-inspection.log" 2>&1 || result=$?
          cat "$GITHUB_WORKSPACE/fixture-index-3-inspection.log"
          echo "Inspector exit status: $result (getter may fail if NFT not initialized)" | tee -a "$GITHUB_WORKSPACE/fixture-index-3-inspection.log"
          exit 0
      - name: Read recent wallet and four-contract transaction history
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync,readFileSync} from 'node:fs';
          const addresses={
            deployer:'0QDQEewIr69mGcq6uDIlAtibxW37gm7rJfKWru7o4_hSPbzu',
            treasury:'0QASRB4XGtN81Pwaef6fWnSJyRwwJEvbbPn-ksz0KQI-bFa0',
            marketplace:'kQCjpxlAc67afGlrC27CGbZzQxjOg8ME42URSFyY3aEL5gCg',
            escrow:'kQBxNyuqr-Ab5_LUzCc6KsXUEN9Q7vGT-HlDslDvBEuEDLK8'
          };
          const log=readFileSync('fixture-index-3-inspection.log','utf8');
          const match=log.match(/S07_09_EXPECTED_NFT_ADDRESS:\s*(\S+)/);
          if(match)addresses.expectedNft=match[1];
          const headers=process.env.TONCENTER_API_KEY?{'X-API-Key':process.env.TONCENTER_API_KEY}:{};
          const result={runInvestigated:'43874285713',itemIndex:3,windowUtc:['2026-11-16T13:16:00Z','2026-11-16T13:21:00Z'],addresses,accounts:{}};
          for(const [name,address] of Object.entries(addresses)){
            try{
              const url=new URL('https://testnet.toncenter.com/api/v2/getTransactions');
              url.searchParams.set('address',address);url.searchParams.set('limit','20');
              let res; for(let attempt=0;attempt<4;attempt++){res=await fetch(url,{headers,signal:AbortSignal.timeout(25000)});if(res.ok || ![429,500,502,503,504,542].includes(res.status))break;await new Promise(resolve=>setTimeout(resolve,1500*(attempt+1)));}
              if(!res.ok)throw Error('HTTP '+res.status);
              const json=await res.json();if(!json.ok)throw Error(JSON.stringify(json));
              const txs=json.result??[];
              result.accounts[name]={count:txs.length,transactions:txs.map(tx=>({
                utime:tx.utime,lt:tx.transaction_id?.lt,hash:tx.transaction_id?.hash,
                incoming:tx.in_msg&&{source:tx.in_msg.source,destination:tx.in_msg.destination,value:tx.in_msg.value},
                outgoing:(tx.out_msgs??[]).map(m=>({source:m.source,destination:m.destination,value:m.value}))
              }))};
              console.log(name+': '+txs.length+' recent transactions');
            }catch(error){result.accounts[name]={error:String(error)};console.error(name+': '+error)}
          }
          writeFileSync('fixture-index-3-transactions.json',JSON.stringify(result,null,2));
          NODE
      - name: Compare live NFT account code and inspect owner history (read only)
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {Cell} from '@ton/core';
          const log=readFileSync('fixture-index-3-inspection.log','utf8');
          const extract=(key)=>log.match(new RegExp(key+':\\s*(\\S+)'))?.[1]??null;
          const nft=extract('S07_09_EXPECTED_NFT_ADDRESS');
          const expectedCodeHash=extract('S07_09_EXPECTED_CODE_HASH');
          const output={nft,expectedCodeHash,chainCodeHash:null,codeMatches:null,account:null,transactions:[],errors:[]};
          const headers=process.env.TONCENTER_API_KEY?{'X-API-Key':process.env.TONCENTER_API_KEY}:{};
          async function request(method,params){
            const url=new URL('https://testnet.toncenter.com/api/v2/'+method);
            for(const [key,value] of Object.entries(params))url.searchParams.set(key,String(value));
            let lastError;
            for(let i=0;i<4;i++){
              try{
                const response=await fetch(url,{headers,signal:AbortSignal.timeout(20000)});
                if(!response.ok)throw Error('HTTP '+response.status);
                const json=await response.json();
                if(!json.ok)throw Error(JSON.stringify(json));
                return json.result;
              }catch(error){lastError=error;await new Promise(resolve=>setTimeout(resolve,1000*(i+1)));}
            }
            throw lastError;
          }
          if(!nft){output.errors.push('NFT address missing from inspection log');}
          else {
            try {
              const account=await request('getAddressInformation',{address:nft});
              output.account={state:account.state,balance:account.balance,last_transaction_id:account.last_transaction_id};
              if(account.code){
                output.chainCodeHash=Cell.fromBoc(Buffer.from(account.code,'base64'))[0].hash().toString('hex');
                const clean=s=>String(s??'').replace(/^0x/,'').toLowerCase();
                const expectedHex=/^[0-9]+$/.test(expectedCodeHash??'')?BigInt(expectedCodeHash).toString(16).padStart(64,'0'):clean(expectedCodeHash);
                if(expectedHex && /^[0-9a-f]{64}$/i.test(expectedHex)){
                  output.codeMatches=expectedHex===clean(output.chainCodeHash);
                }
              }
            }catch(error){output.errors.push('account: '+error);}
            try {
              let transactions;
              try{transactions=await request('getTransactions',{address:nft,limit:50,archival:true});}
              catch(error){output.errors.push('archival history: '+error);transactions=await request('getTransactions',{address:nft,limit:10});}
              output.transactions=transactions.map(tx=>({
                utime:tx.utime,lt:tx.transaction_id?.lt,hash:tx.transaction_id?.hash,
                incoming:tx.in_msg&&{source:tx.in_msg.source,destination:tx.in_msg.destination,value:tx.in_msg.value,op:tx.in_msg.message},
                outgoing:(tx.out_msgs??[]).map(m=>({source:m.source,destination:m.destination,value:m.value}))
              }));
            }catch(error){output.errors.push('history: '+error);}
          }
          writeFileSync('fixture-index-3-code-history.json',JSON.stringify(output,null,2));
          console.log(JSON.stringify({nft,expectedCodeHash,chainCodeHash:output.chainCodeHash,codeMatches:output.codeMatches,account:output.account,transactionCount:output.transactions.length,errors:output.errors},null,2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: s07-09-index-3-readonly-${{ github.run_id }}
          path: |
            fixture-index-3-inspection.log
            fixture-index-3-transactions.json
            fixture-index-3-code-history.json
          if-no-files-found: warn
