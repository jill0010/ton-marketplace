name: S05 Official NFT Code StateInit and Libraries (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts/marketplace
    steps:
      - name: Checkout S05 audit branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feature/reserve-refund-v3-audit
          persist-credentials: false
      - name: Setup Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e
      - name: Compile production contracts
        run: acton build
      - name: Verify official gift code hashes and StateInit-derived mainnet reference addresses
        run: acton test tests/gift-nft-address.test.tolk
      - name: Verify escrow and publish allowlists agree with official code hashes
        run: node scripts/check-fragment-item-code-policy.mjs
      - name: Read-only testnet shared-library availability (no chain writes)
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
          TESTNET_ITEM_VARIANT: all
          REQUIRE_TESTNET_LIBRARIES: "true"
        run: |
          if [ -z "$TONCENTER_API_KEY" ]; then
            echo "::error::TONCENTER_TESTNET_API_KEY is missing; cannot establish library availability."
            exit 1
          fi
          node scripts/check-testnet-fragment-libraries.mjs
