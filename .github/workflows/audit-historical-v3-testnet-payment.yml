name: Audit Historical 0.21 TON Testnet Payment (Read Only)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/reserve-refund-v3-audit
    paths:
      - .github/workflows/audit-historical-v3-testnet-payment.yml
      - contracts/marketplace/scripts/inspect-historical-testnet-payment.mjs
      - contracts/marketplace/scripts/inspect-historical-testnet-payment.test.mjs
      - contracts/marketplace/scripts/audit-historical-payment-followup.mjs
      - contracts/marketplace/scripts/audit-historical-payment-followup.test.mjs

permissions:
  contents: read

jobs:
  historical-payment:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Inspect historical testnet transaction without signing or transfers
        id: inspect
        shell: bash
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        run: |
          set -euo pipefail
          node contracts/marketplace/scripts/inspect-historical-testnet-payment.mjs | tee historical-payment-report.json
      - name: Inspect later Marketplace outflows without signing
        shell: bash
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        run: |
          set -euo pipefail
          node contracts/marketplace/scripts/audit-historical-payment-followup.mjs | tee historical-payment-followup.json
      - name: Publish read-only evidence status
        if: always()
        shell: bash
        run: |
          {
            echo "## Historical 0.21 TON testnet payment"
            echo "This job is read-only and does not authorize retries, refunds or transfers."
            if [ -f historical-payment-report.json ]; then
              echo '~~~json'
              cat historical-payment-report.json
              echo '~~~'
            else
              echo "Transaction lookup did not produce a complete report."
            fi
            if [ -f historical-payment-followup.json ]; then
              echo "### Subsequent outflow candidates (refund not yet confirmed)"
              echo '~~~json'
              cat historical-payment-followup.json
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
