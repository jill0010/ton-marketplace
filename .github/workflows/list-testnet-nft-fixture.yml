name: List Testnet NFT Fixture

on:
  workflow_dispatch:
    inputs:
      confirm_testnet_listing:
        description: "Configure test collection and list the existing NFT into custody with 0.55 test TON attached, plus wallet fees."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testnet-nft-listing
  cancel-in-progress: false

jobs:
  rehearsal:
    if: ${{ inputs.confirm_testnet_listing == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts/marketplace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e
      - name: Build and run contract tests
        run: |
          acton build
          acton test --backtrace full
      - name: Rehearse exact deployment script without a signer
        env:
          TESTNET_FIXTURE_ENABLED: "true"
          FIXTURE_EMULATION: "true"
        run: acton script scripts/rehearse-testnet-fixture-listing.tolk

  deploy:
    needs: rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts/marketplace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Check selected library on Testnet before loading signer
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
          TESTNET_ITEM_VARIANT: peppermint
          REQUIRE_TESTNET_LIBRARIES: "true"
        run: node scripts/check-testnet-fragment-libraries.mjs
      - uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e
      - name: Build
        run: acton build
      - name: Configure and list existing fixture on TON Testnet
        env:
          SELLER_MNEMONIC: ${{ secrets.TESTNET_SELLER_MNEMONIC }}
          DEPLOYER_MNEMONIC: ${{ secrets.TESTNET_DEPLOYER_MNEMONIC }}
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
          TESTNET_LISTING_ENABLED: "true"
          FIXTURE_EMULATION: "false"
          TESTNET_FIXTURE_OWNER: "kQDQEewIr69mGcq6uDIlAtibxW37gm7rJfKWru7o4_hSPeEr"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_MNEMONIC"
          test -n "$SELLER_MNEMONIC" || { echo "::error::Missing TESTNET_SELLER_MNEMONIC"; exit 1; }
          test -n "$TONCENTER_API_KEY"
          trap 'rm -f wallets.toml' EXIT
          umask 077
          cat > wallets.toml <<'WALLETS'
          [wallets.deployer]
          kind = "v5r1"
          workchain = 0
          keys = { mnemonic-env = "DEPLOYER_MNEMONIC" }
          [wallets.seller]
          kind = "v5r1"
          workchain = 0
          keys = { mnemonic-env = "SELLER_MNEMONIC" }
          WALLETS
          acton script scripts/run-testnet-fixture-listing.tolk --net testnet 2>&1 | tee testnet-fixture.log
          grep -Fq "Test listing active; product ID:" testnet-fixture.log
          {
            echo "## TON Testnet fixture custody listing"
            echo "Commit: $GITHUB_SHA"
            grep -E "Test listing active; product ID:|Test listing escrow ID:|NFT custody verified:" testnet-fixture.log
            echo "Configuration, registration and transfer attach up to 0.55 test TON, plus wallet network fees."
            echo "Synthetic test asset using approved Item code; not an official Telegram gift."
            echo "Uses existing Marketplace and Escrow. Test collection is enabled and NFT is transferred into custody. No purchase or refund is performed."
          } >> "$GITHUB_STEP_SUMMARY"
