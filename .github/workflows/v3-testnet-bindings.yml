name: Verify Deployed V3 Testnet Bindings (Read Only)

on:
  workflow_dispatch:
    inputs:
      inspect_order_id:
        description: 'Optional existing V3 testnet order ID to inspect without sending transactions'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
      V3_BINDINGS_EVIDENCE_OUTPUT: v3-testnet-bindings-evidence.json
      V3_COMBINED_EVIDENCE_OUTPUT: v3-testnet-combined-evidence.json
      V3_ORDER_EVIDENCE_OUTPUT: v3-testnet-order-evidence.json
      V3_TESTNET_ORDER_ID: ${{ inputs.inspect_order_id }}
      V3_TESTNET_MARKETPLACE_ADDRESS: kQAa5cnyurZayVXfJE_rkBiWz19w487aklFEAu6Wm9Fm-Sc6
      V3_TESTNET_ESCROW_ADDRESS: kQCD_2amR3idpahAfj0xdgU9m34Z7s933HtXoDx-ka3J4_Rr
      V3_TESTNET_COORDINATOR_ADDRESS: kQCC2k5wZSjitzFvGGUgyx_6KMWIIuSDQViNy_kw2j6OtqXy
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify getter decoding tests
        run: node --test contracts/marketplace/scripts/verify-v3-testnet-bindings.test.mjs
      - name: Test correlated V3 deployment and binding evidence
        run: node --test contracts/marketplace/scripts/merge-v3-evidence.test.mjs
      - name: Test V3 testnet order inspection (read-only mocks)
        run: node --test contracts/marketplace/scripts/inspect-v3-testnet-order.test.mjs
      - name: Setup Acton for independently reproducible deployment hashes
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e # v1.2.0
      - name: Checkout original V3 testnet deployment source (pinned commit)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 0b412afa994b1f9f81ee9a288dce32acc6819041
          path: pinned-v3-deployment
          persist-credentials: false
      - name: Rebuild original V3 code hashes without deploying
        shell: bash
        run: |
          set -euo pipefail
          cp contracts/marketplace/tests/v3-compiled-hashes.test.tolk pinned-v3-deployment/contracts/marketplace/tests/v3-compiled-hashes.test.tolk
          (
            cd pinned-v3-deployment/contracts/marketplace
            acton build
            acton test tests/v3-compiled-hashes.test.tolk
          ) 2>&1 | tee v3-reproduced-build-hashes.log
      - name: Verify original compiled hashes against existing on-chain code (read only)
        env:
          V3_HASH_EVIDENCE_OUTPUT: v3-testnet-reproduced-code-hashes.json
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          import { normalizeV3CodeHash, verifyV3Testnet } from "./contracts/marketplace/scripts/verify-v3-testnet.mjs";
          const output = await readFile("v3-reproduced-build-hashes.log", "utf8");
          const expected = {};
          for (const name of ["marketplace", "escrow", "coordinator"]) {
            const prefix = "V3 trusted compiled " + name + " code hash:";
            const lines = output.split(/\r?\n/).filter(line => line.includes(prefix));
            if (lines.length !== 1) throw new Error("Compiled " + name + " hash not uniquely reported");
            expected[name] = normalizeV3CodeHash(lines[0].slice(lines[0].indexOf(prefix) + prefix.length).trim());
          }
          const addresses = {
            marketplace: process.env.V3_TESTNET_MARKETPLACE_ADDRESS,
            escrow: process.env.V3_TESTNET_ESCROW_ADDRESS,
            coordinator: process.env.V3_TESTNET_COORDINATOR_ADDRESS,
          };
          const result = await verifyV3Testnet(addresses, fetch, expected);
          const evidence = {
            schemaVersion: 1, network: "testnet",
            sourceCommit: "0b412afa994b1f9f81ee9a288dce32acc6819041",
            sourceToolchain: "Acton 1.2.1",
            expectedCompiledHashes: expected, observed: result,
            trustedCodeHashesMatch: result.codeHashesVerified,
            realFundsApproved: false, mainnetApproved: false,
            noTransactionSent: true, checkedAt: new Date().toISOString(),
          };
          await writeFile(process.env.V3_HASH_EVIDENCE_OUTPUT, JSON.stringify(evidence, null, 2) + "\n",
            { flag: "wx", mode: 0o600 });
          console.log("Pinned deployment hash comparison: " + (result.codeHashesVerified ? "MATCH" : "BLOCKED"));
          if (!result.codeHashesVerified) process.exitCode = 1;
          NODE
      - name: Upload reproduced V3 compiled code hash evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v3-testnet-reproduced-code-hashes
          path: |
            v3-testnet-reproduced-code-hashes.json
            v3-reproduced-build-hashes.log
          if-no-files-found: warn
          retention-days: 90
      - name: Verify eight deployed contract bindings (read-only)
        run: node contracts/marketplace/scripts/verify-v3-testnet-bindings.mjs
      - name: Audit deployment and bindings in one read-only testnet snapshot
        run: node contracts/marketplace/scripts/audit-v3-testnet.mjs
      - name: Inspect an existing V3 order and reserve (optional, read-only)
        if: ${{ inputs.inspect_order_id != '' }}
        run: node contracts/marketplace/scripts/inspect-v3-testnet-order.mjs
      - name: Upload optional V3 order evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v3-testnet-order-evidence
          path: v3-testnet-order-evidence.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload correlated V3 testnet evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v3-testnet-combined-evidence
          path: v3-testnet-combined-evidence.json
          if-no-files-found: warn
          retention-days: 90
      - name: Upload on-chain binding evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v3-testnet-bindings-evidence
          path: v3-testnet-bindings-evidence.json
          if-no-files-found: warn
          retention-days: 90
      - name: Safety summary
        if: always()
        run: |
          echo "V3 TESTNET ONLY. No transaction was sent by this verifier." >> "$GITHUB_STEP_SUMMARY"
          echo "Binding checks do not prove trusted code hashes, funded settlement, refund finality, or mainnet readiness." >> "$GITHUB_STEP_SUMMARY"
