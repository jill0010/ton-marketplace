name: S07-04 Check Recovered NFT Ownership (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
      S07_04_RECOVERED_NFT_ADDRESS: kQADbJlooYUmz6-iT8a9tQ3nJJIq3vO7gdnAFmdgNOu0FJpr
      V3_PRODUCTION_TESTNET_MARKETPLACE_ADDRESS: kQC_UhR2wStYmFmPl_W2acYW7aeLUMBWn7GgQN4b1GmxqCyA
      V3_PRODUCTION_TESTNET_ESCROW_ADDRESS: kQBMWX9agczB5MGgqHQTBU2yhVS7ApWAjhgaeoFHdkQBRsCy
      V3_TESTNET_DEPLOYER_ADDRESS: 0QDQEewIr69mGcq6uDIlAtibxW37gm7rJfKWru7o4_hSPbzu
      PLATFORM_TREASURY_ADDRESS: 0QASRB4XGtN81Pwaef6fWnSJyRwwJEvbbPn-ksz0KQI-bFa0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feature/reserve-refund-v3-audit
          persist-credentials: false
      - uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e
      - name: Verify recovered NFT owner and prior listing, without transactions
        working-directory: contracts/marketplace
        run: |
          set -euo pipefail
          acton build
          acton script scripts/s07-04-check-recovered-nft-readonly.tolk --net testnet 2>&1 | tee ../../s07-04-recovered-nft-ownership.log
          grep -Fq 'S07_04_READ_ONLY: true' ../../s07-04-recovered-nft-ownership.log
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s07-04-recovered-nft-owner-${{ github.run_id }}
          path: s07-04-recovered-nft-ownership.log
          if-no-files-found: ignore
          retention-days: 30
