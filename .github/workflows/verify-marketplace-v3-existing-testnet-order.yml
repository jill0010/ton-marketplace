name: Verify Existing Marketplace V3 Testnet Order (Read Only)

on:
  workflow_dispatch:
    inputs:
      marketplace_address:
        description: "Existing TESTNET Marketplace V3 address"
        required: true
        type: string
      coordinator_address:
        description: "Existing TESTNET Reserve Coordinator V3 address"
        required: true
        type: string
      nft_item_address:
        description: "Existing TESTNET synthetic NFT Item address"
        required: true
        type: string
      inspect_fresh_fixture:
        description: "Inspect a newly deployed fixture without using the historical purchase trace or historical order assumptions (READ ONLY)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: marketplace-v3-existing-testnet-readonly
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts/marketplace
    env:
      DEPLOYER_MNEMONIC: ${{ secrets.TESTNET_DEPLOYER_MNEMONIC }}
      SELLER_MNEMONIC: ${{ secrets.TESTNET_SELLER_MNEMONIC }}
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
      V3_PRODUCTION_TESTNET_MARKETPLACE_ADDRESS: ${{ inputs.marketplace_address }}
      V3_PRODUCTION_TESTNET_COORDINATOR_ADDRESS: ${{ inputs.coordinator_address }}
      V3_TESTNET_FIXTURE_NFT_ADDRESS: ${{ inputs.nft_item_address }}
      V3_INSPECT_FRESH_FIXTURE: ${{ inputs.inspect_fresh_fixture }}
      V3_TESTNET_DEPLOYER_ADDRESS: "0QDQEewIr69mGcq6uDIlAtibxW37gm7rJfKWru7o4_hSPbzu"
      PLATFORM_TREASURY_ADDRESS: "0QASRB4XGtN81Pwaef6fWnSJyRwwJEvbbPn-ksz0KQI-bFa0"
    steps:
      - name: Enforce read-only diagnostic branch
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feature/reserve-refund-v3-audit" || {
            echo "::error::Select feature/reserve-refund-v3-audit in Run workflow."
            exit 1
          }
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feature/reserve-refund-v3-audit
          persist-credentials: false
      - name: Confirm checked-out diagnostic script exists
        shell: bash
        run: |
          test -f scripts/diagnose-v3-existing-testnet-order.tolk
      - name: Setup Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e # v1.2.0
      - name: Create ephemeral read-only wallet profiles
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_MNEMONIC"
          test -n "$SELLER_MNEMONIC"
          test -n "$TONCENTER_API_KEY"
          cat > wallets.toml <<'WALLETS'
          [wallets.deployer]
          kind = "v5r1"
          workchain = 0
          keys = { mnemonic-env = "DEPLOYER_MNEMONIC" }

          [wallets.treasury]
          kind = "v5r1"
          mnemonic-scheme = "bip39"
          workchain = 0
          keys = { mnemonic-env = "SELLER_MNEMONIC" }
          WALLETS
          chmod 600 wallets.toml
      - name: Build verifier (no deployment)
        run: acton build
      - name: Inspect historical Testnet purchase trace (read only)
        if: ${{ !inputs.inspect_fresh_fixture }}
        shell: bash
        run: |
          set -euo pipefail
          # Fixed prior purchase transaction; do not submit a second payment.
          acton rpc trace --net testnet --verbose --show-bodies e7a04f5f059ae336811a4b135231a5ad5785743c08e01098b34788c18d527e9f > v3-existing-testnet-purchase-trace.log 2>&1 || {
            echo "Historical trace lookup failed; retain the diagnostic and proceed with account getters."
            tail -60 v3-existing-testnet-purchase-trace.log
          }
          cat v3-existing-testnet-purchase-trace.log
      - name: Preserve historical transaction identity and prevent cross-deployment inference
        if: ${{ !inputs.inspect_fresh_fixture }}
        shell: bash
        run: |
          set -euo pipefail
          # The rejected 0.21 TON payment targeted the legacy Marketplace,
          # NOT the newly deployed V3 production fixture. Never treat the
          # fresh listing's missing order as proof about that old payment.
          historical_marketplace="kQDC5qBHrvcwaJamwEzZTbuI4YjKX3fEegQHV2IXgu9Fro8Y"
          if [ "$V3_PRODUCTION_TESTNET_MARKETPLACE_ADDRESS" != "$historical_marketplace" ]; then
            {
              echo "### Historical 0.21 TON transaction — scope warning"
              echo "- Historical payment target: $historical_marketplace"
              echo "- Inspected Marketplace: $V3_PRODUCTION_TESTNET_MARKETPLACE_ADDRESS"
              echo "- These are different deployments; a missing order on the inspected deployment does NOT establish the legacy payment's disposition."
              echo "- Transaction-level balance, inbound/outbound and bounce reconciliation remains mandatory."
              echo "- No retry, refund, purchase or transfer is authorized."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Diagnose existing order and reserve (no transfers)
        shell: bash
        run: |
          set -euo pipefail
          acton script scripts/diagnose-v3-existing-testnet-order.tolk --net testnet --backtrace full 2>&1 | tee v3-existing-testnet-diagnostic.log
      - name: Classify historical rejection and guard against duplicate payments
        if: ${{ !inputs.inspect_fresh_fixture }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, appendFile } from 'node:fs/promises';
          const trace = await readFile('v3-existing-testnet-purchase-trace.log', 'utf8');
          const diagnosis = await readFile('v3-existing-testnet-diagnostic.log', 'utf8');
          const match = (key) => diagnosis.split(String.fromCharCode(10)).find(line => line.startsWith(key + ':'))?.split(':').slice(1).join(':').trim();
          const rejected = trace.split(String.fromCharCode(10)).some(line => line.includes('BuyProductV2') && line.includes('exit_code=212 aborted'));
          const missingOrder = match('V3_DIAGNOSTIC_ORDER_ID') === 'null';
          const noBounce = /bounced: false/.test(trace);
          const checks = [
            'V3_DIAGNOSTIC_HISTORICAL_DEADLINE_VALID',
            'V3_DIAGNOSTIC_PRODUCT_ID_MATCHES',
            'V3_DIAGNOSTIC_PRODUCT_NFT_MATCHES_FIXTURE',
            'V3_DIAGNOSTIC_HISTORICAL_QUERY_VALID',
            'V3_DIAGNOSTIC_PRICE_VALID',
            'V3_DIAGNOSTIC_TREASURY_CONFIGURED',
            'V3_DIAGNOSTIC_ESCROW_CONFIGURED',
            'V3_DIAGNOSTIC_COORDINATOR_CONFIGURED',
          ];
          const failed = checks.filter(k => match(k) !== 'true');
          const lines = [
            '### Existing Testnet purchase: read-only classification',
            '- Historical Marketplace exit code: ' + (rejected ? '212 (InvalidPurchase)' : 'not confirmed'),
            '- Persisted order: ' + (missingOrder ? 'absent' : match('V3_DIAGNOSTIC_ORDER_ID')),
            '- Order 1 reserve compensation: user-confirmed manual off-chain 0.2 TON compensation is complete; never issue a duplicate payment.',
            '- Historical inbound bounced flag: ' + (noBounce ? 'false (do not assume funds were refunded)' : 'not confirmed'),
            '- Failed diagnostic checks: ' + (failed.length ? failed.join(', ') : 'none of the recorded basic checks'),
            '- Historical deadline: 896 seconds after recorded inbound timestamp; 4 seconds below the 900-second maximum future horizon (NOT four seconds before expiry). Confirm exact chain timestamp and contract predicate.',
            '- Getter coverage: legacy deployment lacks newer schema/query introspection getters; this is not, by itself, proof of a deployed-code hash mismatch',
            '- Remaining unknowns: exact inbound created_at and historical purchase-schema/query-index state (read-only; no replay)',
            '- **Safety gate: NO second purchase, NO mainnet deployment, NO automated replay.**',
          ];
          const summary = lines.join(String.fromCharCode(10)) + String.fromCharCode(10);
          console.log(summary);
          if (process.env.GITHUB_STEP_SUMMARY) await appendFile(process.env.GITHUB_STEP_SUMMARY, summary);
          if (!rejected || !missingOrder || failed.length) process.exitCode = 1;
          NODE
      - name: Verify existing order and reserve (no transfers)
        if: ${{ !inputs.inspect_fresh_fixture }}
        shell: bash
        run: |
          set -euo pipefail
          order_id="$(sed -n 's/^V3_DIAGNOSTIC_ORDER_ID: *//p' v3-existing-testnet-diagnostic.log | tail -1)"
          if [ -z "$order_id" ] || [ "$order_id" = "null" ]; then
            {
              echo "### Existing-order reserve verification"
              echo "- Status: **SKIPPED — no persisted order exists for the inspected listing.**"
              echo "- No purchase, transfer, retry, or refund was submitted."
              echo "- A reserve vault cannot be verified until a real Testnet order is created through the corrected V3 purchase flow."
            } | tee v3-existing-testnet-readonly.log >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          acton script scripts/verify-v3-production-testnet-purchase.tolk --net testnet --backtrace full 2>&1 | tee v3-existing-testnet-readonly.log
          grep -Fq "V3_TESTNET_VAULT_ADDRESS:" v3-existing-testnet-readonly.log
      - name: Summarize fresh fixture without sending funds
        if: ${{ inputs.inspect_fresh_fixture }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "V3_FRESH_RESULT:" v3-existing-testnet-diagnostic.log
          grep -Fq "V3_FRESH_ESCROW_OWNS_NFT: true" v3-existing-testnet-diagnostic.log
          grep -Fq "V3_FRESH_LISTING_READY_FOR_CONTROLLED_TEST: true" v3-existing-testnet-diagnostic.log
          {
            echo "### Fresh V3 Testnet fixture — read-only inspection"
            echo "- Source: previously deployed Marketplace, Coordinator and synthetic NFT"
            echo "- No deployment, purchase, refund, transfer or attestation was submitted."
            echo "- Status: $(grep -F 'V3_FRESH_RESULT:' v3-existing-testnet-diagnostic.log | tail -1)"
            echo "- Order: $(grep -F 'V3_FRESH_ORDER_ID:' v3-existing-testnet-diagnostic.log | tail -1)"
            echo "- NFT custody: $(grep -F 'V3_FRESH_ESCROW_OWNS_NFT:' v3-existing-testnet-diagnostic.log | tail -1)"
            echo "- Listing readiness: $(grep -F 'V3_FRESH_LISTING_READY_FOR_CONTROLLED_TEST:' v3-existing-testnet-diagnostic.log | tail -1)"
            echo "- Mainnet remains blocked."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v3-existing-testnet-readonly-evidence
          path: |
            contracts/marketplace/v3-existing-testnet-purchase-trace.log
            contracts/marketplace/v3-existing-testnet-diagnostic.log
            contracts/marketplace/v3-existing-testnet-readonly.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove temporary wallet profile
        if: always()
        run: |
          if [ -d contracts/marketplace ]; then
            rm -f contracts/marketplace/wallets.toml
          fi
        working-directory: .
