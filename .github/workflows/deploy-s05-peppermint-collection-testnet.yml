name: Deploy S05 Peppermint Collection Testnet

on:
  workflow_dispatch:
    inputs:
      confirm_s05_testnet_only:
        description: "Approve one mint into the EXISTING S05 Collection on TESTNET only; no Collection deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: s05-peppermint-collection-testnet
  cancel-in-progress: false

jobs:
  deploy-s05:
    if: ${{ inputs.confirm_s05_testnet_only == true && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts/marketplace
    env:
      DEPLOYER_MNEMONIC: ${{ secrets.TESTNET_DEPLOYER_MNEMONIC }}
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
      S05_MINT_TESTNET_APPROVED: "true"
      S05_EXISTING_COLLECTION_ADDRESS: "EQABD-C8AWc8PnlrsZYg-aDWrB3MhsB0etXI91KO6lZs3KO4"
      S05_TESTNET_DEPLOYER_ADDRESS: "0QDQEewIr69mGcq6uDIlAtibxW37gm7rJfKWru7o4_hSPbzu"
      S05_TESTNET_SELLER_ADDRESS: "0QASRB4XGtN81Pwaef6fWnSJyRwwJEvbbPn-ksz0KQI-bFa0"
      S05_PEPPERMINT_ITEM_CODE_BOC_HEX: "b5ee9c720101010100230008420291d9e2ac169fc785ce00de0a81af27622b9b7d1764415c775e7e50c03ce98aa2"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require testnet secrets before any transactions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_MNEMONIC" || { echo "::error::TESTNET_DEPLOYER_MNEMONIC missing"; exit 1; }
          test -n "$TONCENTER_API_KEY" || { echo "::error::TONCENTER_TESTNET_API_KEY missing"; exit 1; }
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo "::error::Rerun prohibited after possible broadcast"; exit 1; }

      - name: Strictly verify Peppermint library is published on TON Testnet
        env:
          TESTNET_ITEM_VARIANT: "peppermint"
          REQUIRE_TESTNET_LIBRARIES: "true"
        run: node scripts/check-testnet-fragment-libraries.mjs

      - name: Install existing project dependencies for read-only preflight
        working-directory: .
        run: npm ci

      - name: Verify Collection owner, Item code, minted flag and NFT absence before broadcast
        working-directory: .
        run: node scripts/s05-existing-collection-preflight.mjs

      - name: Setup Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e # v1.2.0

      - name: Create ephemeral deployer wallet profile
        shell: bash
        run: |
          set -euo pipefail
          cat > wallets.toml <<'WALLETS'
          [wallets.deployer]
          kind = "v5r1"
          workchain = 0
          keys = { mnemonic-env = "DEPLOYER_MNEMONIC" }
          WALLETS
          chmod 600 wallets.toml

      - name: Build S05 contracts
        run: acton build

      - name: Mint Peppermint NFT into existing S05 Collection on TON Testnet
        shell: bash
        run: |
          set -euo pipefail
          acton script scripts/mint-s05-existing-peppermint-testnet.tolk --net testnet 2>&1 | tee s05-testnet-deployment.log
          grep -Fq "S05_COLLECTION_ADDRESS:" s05-testnet-deployment.log
          grep -Fq "S05_NFT_ITEM_ADDRESS:" s05-testnet-deployment.log
          grep -Fq "S05_SELLER_ADDRESS:" s05-testnet-deployment.log
          {
            echo "## S05 TON Testnet Collection / NFT"
            grep -E '^S05_(COLLECTION_ADDRESS|NFT_ITEM_ADDRESS|SELLER_ADDRESS):' s05-testnet-deployment.log
            echo "This verifies the script's post-mint NFT getter. Marketplace listing and Escrow custody are separate S05 steps."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload S05 deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s05-peppermint-testnet-evidence
          path: contracts/marketplace/s05-testnet-deployment.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove temporary wallet profile
        if: always()
        run: rm -f wallets.toml
