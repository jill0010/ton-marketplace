name: S07-04 List Recovered NFT on Production Escrow (Testnet)
on:
  workflow_dispatch:
    inputs:
      confirm_existing_nft_only:
        description: "I approve listing the exact recovered NFT on TESTNET only (no mint, no purchase)."
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: s07-04-recovered-nft-listing-43819564334
  cancel-in-progress: false
jobs:
  list:
    if: ${{ inputs.confirm_existing_nft_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: contracts/marketplace
    env:
      DEPLOYER_MNEMONIC: ${{ secrets.TESTNET_DEPLOYER_MNEMONIC }}
      SELLER_MNEMONIC: ${{ secrets.TESTNET_SELLER_MNEMONIC }}
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
      S07_04_CONFIRM_RECOVERED_NFT_LISTING: 'true'
      S07_04_RECOVERED_NFT_ADDRESS: kQADbJlooYUmz6-iT8a9tQ3nJJIq3vO7gdnAFmdgNOu0FJpr
      V3_PRODUCTION_TESTNET_MARKETPLACE_ADDRESS: kQC_UhR2wStYmFmPl_W2acYW7aeLUMBWn7GgQN4b1GmxqCyA
      V3_PRODUCTION_TESTNET_ESCROW_ADDRESS: kQBMWX9agczB5MGgqHQTBU2yhVS7ApWAjhgaeoFHdkQBRsCy
      V3_TESTNET_DEPLOYER_ADDRESS: 0QDQEewIr69mGcq6uDIlAtibxW37gm7rJfKWru7o4_hSPbzu
      PLATFORM_TREASURY_ADDRESS: 0QASRB4XGtN81Pwaef6fWnSJyRwwJEvbbPn-ksz0KQI-bFa0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feature/reserve-refund-v3-audit
          persist-credentials: false
      - uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e
      - name: Configure TESTNET wallets
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_MNEMONIC"
          test -n "$SELLER_MNEMONIC"
          cat > wallets.toml <<'WALLETS'
          [wallets.deployer]
          kind = "v5r1"
          workchain = 0
          keys = { mnemonic-env = "DEPLOYER_MNEMONIC" }

          [wallets.treasury]
          kind = "v5r1"
          mnemonic-scheme = "bip39"
          workchain = 0
          keys = { mnemonic-env = "SELLER_MNEMONIC" }
          WALLETS
          chmod 600 wallets.toml
          acton script scripts/check-v3-production-testnet-wallets.tolk --net testnet
      - name: Build production candidate
        run: acton build
      - name: Preflight exact NFT owner and absence of listing (no transaction)
        run: |
          set -euo pipefail
          acton script scripts/s07-04-check-recovered-nft-readonly.tolk --net testnet 2>&1 | tee ../../s07-04-listing-before.log
          grep -Fq 'S07_04_PRODUCT_ID: null' ../../s07-04-listing-before.log
          grep -Fq 'S07_04_OWNER_IS_SELLER: true' ../../s07-04-listing-before.log
      - name: Publish and transfer ORIGINAL NFT into existing production Escrow
        run: |
          set -euo pipefail
          acton script scripts/s07-04-list-recovered-nft-testnet.tolk --net testnet 2>&1 | tee ../../s07-04-recovered-nft-listing.log
          grep -Fq 'S07_04_LISTING_COMPLETE: true' ../../s07-04-recovered-nft-listing.log
      - name: Verify existing NFT ownership/listing after sending
        if: success()
        run: |
          set -euo pipefail
          acton script scripts/s07-04-check-recovered-nft-readonly.tolk --net testnet 2>&1 | tee ../../s07-04-listing-after.log
          grep -Fq 'S07_04_OWNER_IS_ESCROW: true' ../../s07-04-listing-after.log
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s07-04-recovered-nft-listing-${{ github.run_id }}
          path: |
            s07-04-listing-before.log
            s07-04-recovered-nft-listing.log
            s07-04-listing-after.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove wallet profile
        if: always()
        run: rm -f wallets.toml
