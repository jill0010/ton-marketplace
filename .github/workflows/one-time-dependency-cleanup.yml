name: One-time dependency cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-dependency-cleanup.yml"
      - "package.json"
      - "package-lock.json"

permissions: {}

concurrency:
  group: one-time-dependency-cleanup-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  remove-unused-blueprint:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'architecture/unified-trading-v1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Install current locked dependencies
        run: npm ci

      - name: Remove unused Blueprint package and regenerate lockfile
        run: npm uninstall --save-dev @ton/blueprint

      - name: Commit dependency cleanup to the authorized PR branch
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "chore(deps): remove unused TON Blueprint dependency"
          git fetch origin "${BRANCH_NAME}"
          git rebase FETCH_HEAD
          git push origin "HEAD:${BRANCH_NAME}"
