name: Deploy Marketplace V3 Candidate Testnet

on:
  workflow_dispatch:
    inputs:
      confirm_testnet_only:
        description: "I approve spending TESTNET TON only for experimental V3 candidate deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: marketplace-v3-testnet-candidate
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_testnet_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: contracts/marketplace
    env:
      DEPLOYER_MNEMONIC: ${{ secrets.TESTNET_DEPLOYER_MNEMONIC }}
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
      V3_TESTNET_DEPLOY_APPROVED: "true"
      V3_TESTNET_DEPLOYER_ADDRESS: "0QDQEewIr69mGcq6uDIlAtibxW37gm7rJfKWru7o4_hSPbzu"
      PLATFORM_TREASURY_ADDRESS: "0QASRB4XGtN81Pwaef6fWnSJyRwwJEvbbPn-ksz0KQI-bFa0"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e # v1.2.0

      - name: Verify signer secret exists and create ephemeral testnet wallet profile
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_MNEMONIC" || { echo "::error::TESTNET_DEPLOYER_MNEMONIC is missing"; exit 1; }
          cat > wallets.toml <<'WALLETS'
          [wallets.deployer]
          kind = "v5r1"
          workchain = 0
          keys = { mnemonic-env = "DEPLOYER_MNEMONIC" }
          WALLETS
          chmod 600 wallets.toml

      - name: Build V3 testnet candidate
        run: acton build

      - name: Deploy to testnet only (no mainnet or NFT collections)
        shell: bash
        run: |
          set -euo pipefail
          acton script scripts/deploy-v3-testnet.tolk --net testnet > v3-testnet-deployment.log 2>&1 || {
            sed -E 's/([A-Za-z0-9_-]{48})/[TON_ADDRESS]/g' v3-testnet-deployment.log | tail -60
            exit 1
          }
          grep -Fq "V3 testnet candidate marketplace:" v3-testnet-deployment.log
          grep -Fq "V3 testnet candidate escrow:" v3-testnet-deployment.log
          grep -Fq "V3 testnet candidate coordinator:" v3-testnet-deployment.log
          {
            echo "## Experimental V3 testnet candidate"
            grep -E "V3 testnet candidate (marketplace|escrow|coordinator):" v3-testnet-deployment.log
            echo
            echo "These are candidate addresses, NOT verified settlement or mainnet approval."
            echo "Run read-only postflight with trusted expected code hashes before any funded trial."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary wallet profile
        if: always()
        run: rm -f wallets.toml
