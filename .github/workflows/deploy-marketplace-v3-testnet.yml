name: Deploy Marketplace V3 Candidate Testnet

on:
  workflow_dispatch:
    inputs:
      confirm_testnet_only:
        description: "I approve spending TESTNET TON only for experimental V3 candidate deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: marketplace-v3-testnet-candidate
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_testnet_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: contracts/marketplace
    env:
      DEPLOYER_MNEMONIC: ${{ secrets.TESTNET_DEPLOYER_MNEMONIC }}
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
      V3_TESTNET_DEPLOY_APPROVED: "true"
      V3_TESTNET_DEPLOYER_ADDRESS: "0QDQEewIr69mGcq6uDIlAtibxW37gm7rJfKWru7o4_hSPbzu"
      PLATFORM_TREASURY_ADDRESS: "0QASRB4XGtN81Pwaef6fWnSJyRwwJEvbbPn-ksz0KQI-bFa0"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install locked verifier dependencies
        working-directory: .
        run: npm ci --ignore-scripts

      - name: Check testnet wallet preflight and regression tests
        working-directory: .
        run: |
          node --test contracts/marketplace/scripts/preflight-v3-testnet-wallets.test.mjs contracts/marketplace/scripts/postflight-v3-candidate.test.mjs
          node contracts/marketplace/scripts/preflight-v3-testnet-wallets.mjs

      - name: Setup Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e # v1.2.0

      - name: Verify signer secret exists and create ephemeral testnet wallet profile
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_MNEMONIC" || { echo "::error::TESTNET_DEPLOYER_MNEMONIC is missing"; exit 1; }
          cat > wallets.toml <<'WALLETS'
          [wallets.deployer]
          kind = "v5r1"
          workchain = 0
          keys = { mnemonic-env = "DEPLOYER_MNEMONIC" }
          WALLETS
          chmod 600 wallets.toml

      - name: Build V3 testnet candidate
        run: acton build

      - name: Gate testnet deployment on complete contract emulation suite
        run: acton test

      - name: Deploy to testnet only (no mainnet or NFT collections)
        shell: bash
        run: |
          set -euo pipefail
          acton script scripts/deploy-v3-testnet.tolk --net testnet > v3-testnet-deployment.log 2>&1 || {
            sed -E 's/([A-Za-z0-9_-]{48})/[TON_ADDRESS]/g' v3-testnet-deployment.log | tail -60
            exit 1
          }
          grep -Fq "V3 testnet candidate marketplace:" v3-testnet-deployment.log
          grep -Fq "V3 testnet candidate escrow:" v3-testnet-deployment.log
          grep -Fq "V3 testnet candidate coordinator:" v3-testnet-deployment.log
          {
            echo "## Experimental V3 testnet candidate"
            grep -E "^V3 trusted compiled (marketplace|escrow|coordinator) code hash:" v3-testnet-deployment.log
            grep -E "V3 testnet candidate (marketplace|escrow|coordinator):" v3-testnet-deployment.log
            echo
            echo "These are candidate addresses, NOT verified settlement or mainnet approval."
            echo "Run read-only postflight with trusted expected code hashes before any funded trial."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read-only postflight of deployed candidate accounts
        working-directory: .
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node contracts/marketplace/scripts/postflight-v3-candidate.mjs contracts/marketplace/v3-testnet-deployment.log v3-testnet-candidate-postflight.json
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("v3-testnet-candidate-postflight.json", "utf8"));
            const lines = ["", "## Read-only V3 on-chain postflight", ""];
            for (const name of ["marketplace", "escrow", "coordinator"]) {
              const contract = report.report.contracts[name];
              lines.push("- " + name + ": " + contract.address + " (active=" + contract.active + ", observed code hash=" + contract.codeHash + ")");
            }
            lines.push("", "Observed hashes are not trusted build hashes. Bindings, settlement, and mainnet approval remain unverified.");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      - name: Compare deployed code hashes with this build's trusted hashes
        working-directory: .
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          import { extractV3CandidateAddresses } from "./contracts/marketplace/scripts/postflight-v3-candidate.mjs";
          import { verifyV3Testnet } from "./contracts/marketplace/scripts/verify-v3-testnet.mjs";
          const log = await readFile("contracts/marketplace/v3-testnet-deployment.log", "utf8");
          const expected = {};
          for (const name of ["marketplace", "escrow", "coordinator"]) {
            const prefix = "V3 trusted compiled " + name + " code hash:";
            const lines = log.split(/\r?\n/).filter(line => line.includes(prefix));
            if (lines.length !== 1) throw new Error("Missing or duplicate trusted build hash: " + name);
            const hash = lines[0].slice(lines[0].indexOf(prefix) + prefix.length).trim().replace(/^0x/i, "");
            if (!/^[a-fA-F0-9]{64}$/.test(hash)) throw new Error("Invalid trusted build hash: " + name);
            expected[name] = hash.toLowerCase();
          }
          const report = await verifyV3Testnet(extractV3CandidateAddresses(log), fetch, expected);
          await writeFile("v3-testnet-code-hashes.json", JSON.stringify({
            schemaVersion: 1, expected, ...report, checkedAt: new Date().toISOString(),
          }, null, 2) + "\n", { flag: "wx", mode: 0o600 });
          if (!report.codeHashesVerified) throw new Error("On-chain code differs from trusted compiled V3 candidate");
          console.log("All three V3 testnet contract code hashes match this build.");
          NODE

      - name: Verify all eight V3 testnet contract bindings read-only
        working-directory: .
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          import { extractV3CandidateAddresses } from "./contracts/marketplace/scripts/postflight-v3-candidate.mjs";
          import { verifyV3Bindings } from "./contracts/marketplace/scripts/verify-v3-testnet-bindings.mjs";
          const log = await readFile("contracts/marketplace/v3-testnet-deployment.log", "utf8");
          const addresses = extractV3CandidateAddresses(log);
          const report = await verifyV3Bindings(addresses);
          await writeFile("v3-testnet-bindings.json", JSON.stringify({
            schemaVersion: 1, addresses, ...report, checkedAt: new Date().toISOString(),
          }, null, 2) + "\n", { flag: "wx", mode: 0o600 });
          const passed = Object.entries(report.checks).filter(([, check]) => check.matches);
          console.log("V3 testnet bindings verified: " + passed.length + "/8");
          if (!report.bindingsVerified) throw new Error("V3 contract binding mismatch; settlement blocked");
          NODE

      - name: Upload candidate deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v3-testnet-candidate-postflight
          path: |
            v3-testnet-candidate-postflight.json
            v3-testnet-bindings.json
            v3-testnet-code-hashes.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove temporary wallet profile
        if: always()
        run: rm -f wallets.toml
