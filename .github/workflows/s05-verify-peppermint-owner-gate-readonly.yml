name: S05 Verify Peppermint Owner Gate (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts/marketplace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feature/reserve-refund-v3-audit
          persist-credentials: false
      - uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e
      - name: Build contracts
        run: acton build
      - name: Verify initialized index, collection, and seller; block mismatch
        env:
          S05_NFT_ADDRESS: "kQCq13VYJqQ0Oov-a2-MKE57MWIuEtiQaoF_lYNCAEnAofhm"
          S05_EXPECTED_SELLER: "0QASRB4XGtN81Pwaef6fWnSJyRwwJEvbbPn-ksz0KQI-bFa0"
          S05_EXPECTED_COLLECTION: "0QDQEewIr69mGcq6uDIlAtibxW37gm7rJfKWru7o4_hSPbzu"
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        run: acton script scripts/verify-s05-peppermint-owner-readonly.tolk --net testnet
