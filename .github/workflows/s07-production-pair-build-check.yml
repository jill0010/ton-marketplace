name: S07 Production V3 and Escrow Build Check (No Transactions)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/reserve-refund-v3-audit
    paths:
      - 'contracts/marketplace/scripts/deploy-v3-production-testnet.tolk'
      - 'contracts/marketplace/scripts/s07-08-derive-addresses.tolk'
      - '.github/workflows/s07-production-pair-build-check.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts/marketplace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify production-only deployment source
        shell: bash
        run: |
          set -euo pipefail
          test -f contracts/MarketplaceReserveV3.tolk
          test -f contracts/NFTEscrowV2.tolk
          grep -Fq 'import "@wrappers/NFTEscrowV2.gen"' scripts/deploy-v3-production-testnet.tolk
          grep -Fq 'NFTEscrowV2.fromStorage' scripts/deploy-v3-production-testnet.tolk
          grep -Fq 'build("NFTEscrowV2").hash()' scripts/deploy-v3-production-testnet.tolk
          if grep -Eq 'NFTEscrowV2Testnet|--net mainnet' scripts/deploy-v3-production-testnet.tolk; then
            echo "::error::Fixture escrow or Mainnet invocation found"; exit 1
          fi
      - name: Setup Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e
      - name: Build production contracts without wallet or transactions
        run: acton build
      - name: Print compiled production and fixture Escrow hashes (no transactions)
        run: acton script scripts/s07-07-escrow-hashes.tolk --net testnet | tee s07-07-compiled-hashes.log
      - name: Compare compiled production Escrow with live bound Escrow (read only)
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,pathlib,subprocess,re
          actual='0:29e52aa1a818f52cadeaf661e9043b15cd49ccc960621fe9efb5307bab4bdd3f'
          req=urllib.request.Request('https://testnet.toncenter.com/api/v2/jsonRPC',data=json.dumps({'jsonrpc':'2.0','id':1,'method':'getAddressInformation','params':{'address':actual}}).encode(),headers={'Content-Type':'application/json',**({'X-API-Key':os.environ['TONCENTER_API_KEY']} if os.environ.get('TONCENTER_API_KEY') else {})})
          with urllib.request.urlopen(req,timeout=30) as response: data=json.load(response)
          if data.get('error') or not data.get('result'): raise RuntimeError(str(data))
          account=data['result']
          if account.get('state')!='active' or not account.get('code'): raise RuntimeError('Actual Escrow not active with code')
          pathlib.Path('s07-07-bound-escrow-code.b64').write_text(account['code'])
          print('S07_07_BOUND_ESCROW_ACTIVE=true')
          print('S07_07_BOUND_ESCROW_CODE_B64_CAPTURED=true')
          PY
          echo 'Chain code captured; review compiled code hash output above against known chain hash e0fcac28e547f0185f97818ab7690f049c26fbff8efbba3a84fc5d6dd5f80890.'
      - name: Upload S07-07 hash evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s07-07-escrow-hashes-${{ github.run_id }}
          path: |
            contracts/marketplace/s07-07-compiled-hashes.log
            contracts/marketplace/s07-07-bound-escrow-code.b64
          if-no-files-found: warn
          retention-days: 30
      - name: S07-08 production pairing preflight (no wallet, no transactions)
        env:
          S07_08_FRESH_NONCE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,pathlib,json
          source=pathlib.Path('scripts/deploy-v3-production-testnet.tolk').read_text()
          nonce=int(os.environ['S07_08_FRESH_NONCE'])
          assert 0<nonce<9223372036854775807, 'nonce outside uint63 range'
          requirements={
            'testnet_only_approval':'V3_PRODUCTION_TESTNET_DEPLOY_APPROVED',
            'explicit_deployer':'V3_TESTNET_DEPLOYER_ADDRESS',
            'treasury':'PLATFORM_TREASURY_ADDRESS',
            'validator_0':'V3_VALIDATOR_0_PUBLIC_KEY',
            'validator_1':'V3_VALIDATOR_1_PUBLIC_KEY',
            'validator_2':'V3_VALIDATOR_2_PUBLIC_KEY',
            'fresh_nonce':'V3_FRESH_DEPLOYMENT_NONCE',
            'nonce_in_state_init':'nextQueryId: freshNonce',
            'marketplace_code':'build("MarketplaceReserveV3")',
            'production_escrow_code':'build("NFTEscrowV2")',
            'production_escrow_storage':'NFTEscrowV2.fromStorage',
            'escrow_reverse_binding':'marketplace: marketplace.address',
            'verifier_marketplace_binding':'marketplace: marketplace.address',
            'coordinator_marketplace_binding':'marketplace: marketplace.address',
            'coordinator_verifier_binding':'verifier,',
            'testnet_global_id':'networkGlobalId: -3',
            'escrow_config_message':'SetMarketplaceV2Escrow { escrow: escrow.address }',
            'coordinator_config_message':'SetReserveCoordinatorV3 { coordinator }',
            'escrow_persisted_read':'marketplace.escrowV2()',
            'escrow_reverse_read':'escrow.marketplace()',
          }
          checks={k:v in source for k,v in requirements.items()}
          checks['no_fixture_escrow']='NFTEscrowV2Testnet' not in source
          checks['no_mainnet_invocation']='--net mainnet' not in source
          checks['unique_validator_guard']='validator0!! != validator1!!' in source and 'validator0!! != validator2!!' in source and 'validator1!! != validator2!!' in source
          checks['initial_escrow_unconfigured']='escrowConfigured: false' in source
          checks['initial_coordinator_unconfigured']='coordinatorConfigured: false' in source
          checks['deployment_nonce_valid']=True
          output={'stage':'S07-08','branch':'feature/reserve-refund-v3-audit','nonce_candidate':nonce,'checks':checks,'all_static_checks_passed':all(checks.values()),'address_derivation_verified':False,'historical_address_collision_checked':False,'deployed':False,'mainnet_approved':False,'limitations':['Static source checks do not prove actual derived addresses or on-chain identities.','No wallet or deploy transaction is invoked.']}
          pathlib.Path('s07-08-preflight.json').write_text(json.dumps(output,indent=2))
          print(json.dumps(output,indent=2))
          if not all(checks.values()): raise SystemExit('S07-08 static preflight failed')
          PY
      - name: Upload S07-08 preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s07-08-preflight-${{ github.run_id }}
          path: contracts/marketplace/s07-08-preflight.json
          if-no-files-found: warn
          retention-days: 30
      - name: S07-08 derive addresses and check testnet collisions (read only)
        env:
          V3_TESTNET_DEPLOYER_ADDRESS: 0QDQEewIr69mGcq6uDIlAtibxW37gm7rJfKWru7o4_hSPbzu
          PLATFORM_TREASURY_ADDRESS: 0QASRB4XGtN81Pwaef6fWnSJyRwwJEvbbPn-ksz0KQI-bFa0
          V3_FRESH_DEPLOYMENT_NONCE: ${{ github.run_id }}
          V3_VALIDATOR_0_PUBLIC_KEY: '41342504511421031216359151772997008361520885874590610453802248433713791789750'
          V3_VALIDATOR_1_PUBLIC_KEY: '70196674598014218319300736070722549539525448612563048212591029421895869851173'
          V3_VALIDATOR_2_PUBLIC_KEY: '107081252761244582133121058092518624768332978352580661449874361986314605721472'
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        run: |
          set -euo pipefail
          acton script scripts/s07-08-derive-addresses.tolk --net testnet | tee s07-08-derived-addresses.log
          python3 - <<'PY'
          import json,os,pathlib,re,urllib.request
          log=pathlib.Path('s07-08-derived-addresses.log').read_text()
          labels=['MARKETPLACE','ESCROW','COORDINATOR','VERIFIER']
          addresses={}
          for label in labels:
            match=re.search(r'S07_08_'+label+r'_ADDRESS=(\\S+)',log)
            if not match: raise SystemExit('Missing derived address: '+label)
            addresses[label]=match.group(1).strip()
          if len(set(addresses.values()))!=4: raise SystemExit('Derived address collision')
          report={'nonce':int(os.environ['V3_FRESH_DEPLOYMENT_NONCE']),'addresses':addresses,'account_states':{},'all_uninitialized':False,'deployed':False}
          for label,address in addresses.items():
            payload=json.dumps({'jsonrpc':'2.0','id':1,'method':'getAddressInformation','params':{'address':address}}).encode()
            headers={'Content-Type':'application/json'}
            if os.environ.get('TONCENTER_API_KEY'):headers['X-API-Key']=os.environ['TONCENTER_API_KEY']
            req=urllib.request.Request('https://testnet.toncenter.com/api/v2/jsonRPC',data=payload,headers=headers)
            with urllib.request.urlopen(req,timeout=30) as response: result=json.load(response)
            if result.get('error') or not result.get('result'):raise RuntimeError(str(result))
            report['account_states'][label]=result['result'].get('state')
          report['all_uninitialized']=all(state=='uninitialized' for state in report['account_states'].values())
          pathlib.Path('s07-08-address-collision.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          if not report['all_uninitialized']:raise SystemExit('One or more derived addresses already initialized')
          PY
      - name: Upload S07-08 address evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s07-08-address-evidence-${{ github.run_id }}
          path: |
            contracts/marketplace/s07-08-derived-addresses.log
            contracts/marketplace/s07-08-address-collision.json
          if-no-files-found: warn
          retention-days: 30
      - name: Confirm production build without transaction execution
        run: |
          set -euo pipefail
          # acton build above is the production compilation gate. A repository-wide
          # formatter check includes unrelated historical Tolk files and is not
          # a reliable validation of this deployment script.
          echo "Production contracts compiled. Deployment source restrictions verified."
          echo "No wallet loaded and no transaction broadcast by this workflow."
