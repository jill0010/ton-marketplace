name: S07 Production V3 and Escrow Build Check (No Transactions)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/reserve-refund-v3-audit
    paths:
      - 'contracts/marketplace/scripts/deploy-v3-production-testnet.tolk'
      - '.github/workflows/s07-production-pair-build-check.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts/marketplace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify production-only deployment source
        shell: bash
        run: |
          set -euo pipefail
          test -f contracts/MarketplaceReserveV3.tolk
          test -f contracts/NFTEscrowV2.tolk
          grep -Fq 'import "@wrappers/NFTEscrowV2.gen"' scripts/deploy-v3-production-testnet.tolk
          grep -Fq 'NFTEscrowV2.fromStorage' scripts/deploy-v3-production-testnet.tolk
          grep -Fq 'build("NFTEscrowV2").hash()' scripts/deploy-v3-production-testnet.tolk
          if grep -Eq 'NFTEscrowV2Testnet|--net mainnet' scripts/deploy-v3-production-testnet.tolk; then
            echo "::error::Fixture escrow or Mainnet invocation found"; exit 1
          fi
      - name: Setup Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e
      - name: Build production contracts without wallet or transactions
        run: acton build
      - name: Print compiled production and fixture Escrow hashes (no transactions)
        run: acton script scripts/s07-07-escrow-hashes.tolk --net testnet | tee s07-07-compiled-hashes.log
      - name: Compare compiled production Escrow with live bound Escrow (read only)
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,pathlib,subprocess,re
          actual='0:29e52aa1a818f52cadeaf661e9043b15cd49ccc960621fe9efb5307bab4bdd3f'
          req=urllib.request.Request('https://testnet.toncenter.com/api/v2/jsonRPC',data=json.dumps({'jsonrpc':'2.0','id':1,'method':'getAddressInformation','params':{'address':actual}}).encode(),headers={'Content-Type':'application/json',**({'X-API-Key':os.environ['TONCENTER_API_KEY']} if os.environ.get('TONCENTER_API_KEY') else {})})
          with urllib.request.urlopen(req,timeout=30) as response: data=json.load(response)
          if data.get('error') or not data.get('result'): raise RuntimeError(str(data))
          account=data['result']
          if account.get('state')!='active' or not account.get('code'): raise RuntimeError('Actual Escrow not active with code')
          pathlib.Path('s07-07-bound-escrow-code.b64').write_text(account['code'])
          print('S07_07_BOUND_ESCROW_ACTIVE=true')
          print('S07_07_BOUND_ESCROW_CODE_B64_CAPTURED=true')
          PY
          echo 'Chain code captured; review compiled code hash output above against known chain hash e0fcac28e547f0185f97818ab7690f049c26fbff8efbba3a84fc5d6dd5f80890.'
      - name: Upload S07-07 hash evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s07-07-escrow-hashes-${{ github.run_id }}
          path: |
            contracts/marketplace/s07-07-compiled-hashes.log
            contracts/marketplace/s07-07-bound-escrow-code.b64
          if-no-files-found: warn
          retention-days: 30
      - name: Confirm production build without transaction execution
        run: |
          set -euo pipefail
          # acton build above is the production compilation gate. A repository-wide
          # formatter check includes unrelated historical Tolk files and is not
          # a reliable validation of this deployment script.
          echo "Production contracts compiled. Deployment source restrictions verified."
          echo "No wallet loaded and no transaction broadcast by this workflow."
