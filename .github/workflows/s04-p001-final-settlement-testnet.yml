name: S04-P001 Final Testnet Settlement Proof 3-of-3
on:
  workflow_dispatch:
    inputs:
      confirm_final:
        description: "Submit the ONLY final Testnet receipt proof for successfully received 0.2 TON; no refund dispatch"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: s04-p001-final-settlement-666969981
  cancel-in-progress: false
jobs:
  finalize:
    if: ${{ inputs.confirm_final && github.ref == 'refs/heads/feature/reserve-refund-v3-audit' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      S04_P001_FINAL_ATTEST_APPROVED: "true"
      TONCENTER_TESTNET_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
      DEPLOYER_MNEMONIC: ${{ secrets.TESTNET_DEPLOYER_MNEMONIC }}
      V3_VALIDATOR_0_SEED: ${{ secrets.V3_VALIDATOR_0_SEED }}
      V3_VALIDATOR_1_SEED: ${{ secrets.V3_VALIDATOR_1_SEED }}
      V3_VALIDATOR_2_SEED: ${{ secrets.V3_VALIDATOR_2_SEED }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Install isolated TON proof dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts @ton/ton@15.4.0 @ton/crypto@3.3.0
      - name: Verify second receipt and submit final 3-of-3 settlement proof
        run: node contracts/marketplace/scripts/attest-s04-p001-final-settlement.mjs
