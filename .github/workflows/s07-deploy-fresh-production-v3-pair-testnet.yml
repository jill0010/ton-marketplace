name: S07 Deploy Fresh Production V3 Pair to Testnet (No Purchase)

on:
  workflow_dispatch:
    inputs:
      confirm_fresh_testnet_pair_only:
        description: "Resume fixed S07-08 Testnet deployment: existing Marketplace + remaining three contracts; no purchase or Mainnet"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: s07-fresh-production-v3-pair-testnet
  cancel-in-progress: false

jobs:
  deploy-pair:
    if: ${{ inputs.confirm_fresh_testnet_pair_only == true && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts/marketplace
    env:
      DEPLOYER_MNEMONIC: ${{ secrets.TESTNET_DEPLOYER_MNEMONIC }}
      SELLER_MNEMONIC: ${{ secrets.TESTNET_SELLER_MNEMONIC }}
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
      V3_VALIDATOR_0_SEED: ${{ secrets.V3_VALIDATOR_0_SEED }}
      V3_VALIDATOR_1_SEED: ${{ secrets.V3_VALIDATOR_1_SEED }}
      V3_VALIDATOR_2_SEED: ${{ secrets.V3_VALIDATOR_2_SEED }}
      V3_PRODUCTION_TESTNET_DEPLOY_APPROVED: "true"
      V3_RESUME_EXISTING_MARKETPLACE_TESTNET: "true"
      V3_RESUME_EXISTING_ESCROW_TESTNET: "true"
      V3_RESUME_EXISTING_VERIFIER_TESTNET: "true"
      V3_TESTNET_DEPLOYER_ADDRESS: "0QDQEewIr69mGcq6uDIlAtibxW37gm7rJfKWru7o4_hSPbzu"
      PLATFORM_TREASURY_ADDRESS: "0QASRB4XGtN81Pwaef6fWnSJyRwwJEvbbPn-ksz0KQI-bFa0"
      V3_FRESH_DEPLOYMENT_NONCE: "43855669637"
    steps:
      - name: Checkout immutable branch revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Guard production contract sources and Testnet-only deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -f contracts/MarketplaceReserveV3.tolk
          test -f contracts/NFTEscrowV2.tolk
          grep -Fq 'import "@wrappers/NFTEscrowV2.gen"' scripts/deploy-v3-production-testnet.tolk
          grep -Fq 'NFTEscrowV2.fromStorage' scripts/deploy-v3-production-testnet.tolk
          grep -Fq 'build("NFTEscrowV2").hash()' scripts/deploy-v3-production-testnet.tolk
          ! grep -Eq 'NFTEscrowV2Testnet|--net mainnet' scripts/deploy-v3-production-testnet.tolk
          test -n "$DEPLOYER_MNEMONIC"
          test -n "$SELLER_MNEMONIC"
          test -n "$TONCENTER_API_KEY"
          for name in V3_VALIDATOR_0_SEED V3_VALIDATOR_1_SEED V3_VALIDATOR_2_SEED; do
            value="${!name:-}"
            [[ "$value" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::Missing/invalid $name"; exit 1; }
          done
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        working-directory: .
        run: npm ci --ignore-scripts
      - name: Derive public validator keys without exposing seeds
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          node contracts/marketplace/scripts/derive-v3-validator-keys.mjs > "$RUNNER_TEMP/s07-validator-keys.env"
          cat "$RUNNER_TEMP/s07-validator-keys.env" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/s07-validator-keys.env"
      - name: Check Testnet deployer funding before any transaction
        run: node scripts/preflight-v3-testnet-funding.mjs
      - name: Setup Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e
      - name: Confirm exact S07-08 candidate before deployment (read only)
        shell: bash
        run: |
          set -euo pipefail
          acton script scripts/s07-08-derive-addresses.tolk --net testnet > "$RUNNER_TEMP/s07-08-deployment-addresses.log"
          for expected in \
            'S07_08_MARKETPLACE_ADDRESS=kQCjpxlAc67afGlrC27CGbZzQxjOg8ME42URSFyY3aEL5gCg' \
            'S07_08_ESCROW_ADDRESS=kQBxNyuqr-Ab5_LUzCc6KsXUEN9Q7vGT-HlDslDvBEuEDLK8' \
            'S07_08_COORDINATOR_ADDRESS=kQCUs3jh8gTQtlAE3FgLVsiM5_j9TOTLKZUJgqacUFiO5_je' \
            'S07_08_VERIFIER_ADDRESS=kQALNPtOZ5AIkaEwf4hoDTdJwgVttAwDq2ONZwuJTTzrZy-k'; do
            grep -Fxq "$expected" "$RUNNER_TEMP/s07-08-deployment-addresses.log" || {
              echo "::error::Actual validator keys or deployment parameters differ from the S07-08 verified candidate. No transaction sent."
              exit 1
            }
          done
          echo "S07-08 exact four-address candidate matched."
      - name: Create ephemeral Testnet-only wallet profiles
        shell: bash
        run: |
          set -euo pipefail
          cat > wallets.toml <<'WALLETS'
          [wallets.deployer]
          kind = "v5r1"
          workchain = 0
          keys = { mnemonic-env = "DEPLOYER_MNEMONIC" }

          [wallets.treasury]
          kind = "v5r1"
          mnemonic-scheme = "bip39"
          workchain = 0
          keys = { mnemonic-env = "SELLER_MNEMONIC" }
          WALLETS
          chmod 600 wallets.toml
          acton script scripts/check-v3-production-testnet-wallets.tolk --net testnet
      - name: Compile production V3 and production Escrow V2
        run: acton build
      - name: Verify existing Marketplace, Escrow, Verifier code hashes before any transaction
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { Cell } from '@ton/core';
          const candidates = [
            ['Marketplace V3','kQCjpxlAc67afGlrC27CGbZzQxjOg8ME42URSFyY3aEL5gCg',78359546161773769121804334657237004017492887152734900376191088699783038521579n],
            ['NFTEscrow V2','kQBxNyuqr-Ab5_LUzCc6KsXUEN9Q7vGT-HlDslDvBEuEDLK8',81598614757632845067695927561143533301816638303328283688424659201933137039160n],
            ['Settlement Verifier V3','kQALNPtOZ5AIkaEwf4hoDTdJwgVttAwDq2ONZwuJTTzrZy-k',40137527310137199081220684777089428003119541313287351217810842336613359506965n],
          ];
          const headers = process.env.TONCENTER_API_KEY ? {'X-API-Key':process.env.TONCENTER_API_KEY} : {};
          for (const [name,address,expectedHash] of candidates) {
            const url = 'https://testnet.toncenter.com/api/v2/getAddressInformation?address=' + encodeURIComponent(address);
            const response = await fetch(url,{headers});
            if (!response.ok) throw new Error(name + ': TON Center HTTP ' + response.status);
            const result = await response.json();
            if (!result.ok || result.result?.state !== 'active' || !result.result.code) {
              throw new Error(name + ' not active with code; aborting before transactions');
            }
            const actualHash = BigInt('0x' + Cell.fromBase64(result.result.code).hash().toString('hex'));
            if (actualHash !== expectedHash) throw new Error(name + ': live code hash mismatch; aborting before transactions');
            console.log('S07-08 existing ' + name + ' on-chain code hash verified');
          }
          NODE
      - name: Resume remaining Coordinator and verify reciprocal bindings on Testnet
        shell: bash
        run: |
          set -euo pipefail
          acton script scripts/deploy-v3-production-testnet.tolk --net testnet > v3-production-testnet-deployment.log 2>&1 || {
            tail -80 v3-production-testnet-deployment.log
            exit 1
          }
          grep -Fq "PRODUCTION V3 TESTNET deployment and immutable bindings verified." v3-production-testnet-deployment.log
          for name in marketplace escrow coordinator verifier; do
            grep -Fq "V3 testnet candidate $name:" v3-production-testnet-deployment.log
            grep -Fq "V3 trusted compiled $name code hash:" v3-production-testnet-deployment.log
          done
      - name: Read-only independent postflight of code hashes and bindings
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          node contracts/marketplace/scripts/postflight-v3-production-testnet.mjs \
            contracts/marketplace/v3-production-testnet-deployment.log \
            s07-fresh-production-pair-postflight.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('s07-fresh-production-pair-postflight.json', 'utf8'));
          if (!report.candidateAccountsActive || !report.codeHashesVerified || !report.bindingsVerified) {
            throw new Error('S07 production pair on-chain postflight failed');
          }
          console.log('S07 production pair: active, code hashes verified, reciprocal bindings verified');
          NODE
      - name: Upload S07 deployment and independent proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s07-fresh-production-pair-${{ github.run_id }}
          path: |
            contracts/marketplace/v3-production-testnet-deployment.log
            s07-fresh-production-pair-postflight.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove temporary wallet profiles
        if: always()
        run: rm -f wallets.toml
