name: S07-06 NFT Owner and Binding Evidence Read Only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Read NFT getter and contract states
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,time,urllib.request,urllib.parse,urllib.error,datetime,pathlib,sys
          base='https://testnet.toncenter.com/api/v2/'
          addresses={
            'production_escrow':'kQBdX2PpCASy50dZOmspilaHrnPa6mgJ-DhuzBpNR4LJpQOP',
            'production_marketplace_candidate':'kQB9Q03obJYKG84bfXFrpL6OtUcX41z54A3m4LFGf_0a14D_',
            'historical_order_marketplace':'kQAU4RhS-YlpOickiI4iSGlM0da0B2s68xuFhqaRwDtDFGkF',
            'historical_order_escrow':'kQC0LGltRDIVp7FxjHZhYX-FBgHAD1MP1afFSgkYjkhuwycm',
            'nft':'kQADbJlooYUmz6-iT8a9tQ3nJJIq3vO7gdnAFmdgNOu0FJpr'
          }
          def rpc(method,params):
            url=base+method+'?'+urllib.parse.urlencode(params)
            headers={'X-API-Key':os.environ['TONCENTER_API_KEY']} if os.environ.get('TONCENTER_API_KEY') else {}
            for attempt in range(7):
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as resp:data=json.load(resp)
                if not data.get('ok'):raise RuntimeError(str(data.get('error')))
                time.sleep(1.5)
                return data['result']
              except urllib.error.HTTPError as exc:
                if exc.code not in (429,500,502,503,504,542) or attempt==6:raise
                time.sleep(min(3*2**attempt,30))
          evidence={'timestamp_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'network':'testnet','endpoint':base,'accounts':{},'nft_getter':None,'binding_status':'NOT_INDEPENDENTLY_DECODED','message_linkage_status':'NOT_INDEPENDENTLY_VERIFIED','mainnetApproved':False}
          for role,address in addresses.items():
            try:
              a=rpc('getAddressInformation',{'address':address})
              evidence['accounts'][role]={'address':address,'state':a.get('state'),'last_transaction_id':a.get('last_transaction_id'),'has_code':bool(a.get('code'))}
            except Exception as exc:evidence['accounts'][role]={'address':address,'error':str(exc)}
          try:
            # Use documented JSON-RPC POST for runGetMethod, not v2 REST query encoding.
            rpc_url='https://testnet.toncenter.com/api/v2/jsonRPC'
            payload=json.dumps({'jsonrpc':'2.0','id':'s07-06','method':'runGetMethod','params':{'address':addresses['nft'],'method':'get_nft_data','stack':[]}}).encode()
            headers={'Content-Type':'application/json'}
            if os.environ.get('TONCENTER_API_KEY'): headers['X-API-Key']=os.environ['TONCENTER_API_KEY']
            req=urllib.request.Request(rpc_url,data=payload,headers=headers,method='POST')
            for attempt in range(7):
              try:
                with urllib.request.urlopen(req,timeout=20) as resp: response=json.load(resp)
                if 'error' in response:raise RuntimeError('JSON-RPC error: '+str(response['error']))
                getter=response['result']
                break
              except urllib.error.HTTPError as error:
                if error.code not in (429,500,502,503,504,542) or attempt==6:raise
                time.sleep(min(3*2**attempt,30))
            evidence['nft_getter']={'exit_code':getter.get('exit_code'),'stack':getter.get('stack'),'gas_used':getter.get('gas_used')}
            if getter.get('exit_code')!=0:evidence['nft_owner_status']='GETTER_FAILED'
            else:evidence['nft_owner_status']='RAW_STACK_CAPTURED_OWNER_NOT_CANONICALIZED'
          except Exception as exc:
            evidence['nft_getter']={'error':type(exc).__name__+': '+str(exc)}
            evidence['nft_owner_status']='RPC_UNAVAILABLE'
          evidence['limitations']=[
            'Raw getter stack is preserved; address decoding and owner comparison to buyer are not asserted.',
            'Marketplace and Escrow storage bindings are not independently decoded by this workflow.',
            'Transaction message hashes, source/destination, and masterchain finality are not checked here.',
            'Historical fixture success cannot prove production Escrow end-to-end compatibility.'
          ]
          p=pathlib.Path('s07-06-evidence.json');p.write_text(json.dumps(evidence,indent=2,ensure_ascii=False))
          print(json.dumps({'accounts':evidence['accounts'],'nft_owner_status':evidence['nft_owner_status'],'binding_status':evidence['binding_status'],'message_linkage_status':evidence['message_linkage_status'],'mainnetApproved':False},indent=2))
          if any('error' in v for v in evidence['accounts'].values()) or evidence['nft_owner_status'] in ('GETTER_FAILED','RPC_UNAVAILABLE'):
            sys.exit('S07-06_DATA_COLLECTION_INCOMPLETE')
          print('S07_06_RAW_NFT_DATA_COLLECTED=true')
          print('S07_06_PRODUCTION_ACCEPTANCE=false')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: s07-06-nft-binding-evidence-${{ github.run_id }}
          path: s07-06-evidence.json
          retention-days: 30
