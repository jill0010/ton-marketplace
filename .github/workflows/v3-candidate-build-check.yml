name: V3 Candidate Build Check (No Transactions)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/reserve-refund-v3-audit
    paths:
      - 'contracts/marketplace/**'
      - '.github/workflows/v3-candidate-build-check.yml'
      - '.github/workflows/verify-marketplace-v3-existing-testnet-order.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts/marketplace
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked dependencies
        working-directory: .
        run: npm ci --ignore-scripts
      - name: Run V3 verifier and evidence regression tests
        working-directory: .
        run: |
          node --test contracts/marketplace/scripts/verify-v3-testnet.test.mjs contracts/marketplace/scripts/collect-v3-testnet-evidence.test.mjs contracts/marketplace/scripts/verify-v3-testnet-bindings.test.mjs contracts/marketplace/scripts/inspect-v3-testnet-order.test.mjs contracts/marketplace/scripts/prepare-refund-reconciliation.test.mjs contracts/marketplace/scripts/verify-v3-settlement-source.test.mjs contracts/marketplace/scripts/inspect-historical-testnet-payment.test.mjs contracts/marketplace/scripts/audit-historical-payment-followup.test.mjs
      - name: Test secret-free recipient credit finality checks
        working-directory: .
        run: node --test contracts/marketplace/scripts/verify-v3-recipient-credit.test.mjs contracts/marketplace/scripts/verify-v3-outbound-evidence.test.mjs contracts/marketplace/scripts/verify-v3-transfer-finality.test.mjs contracts/marketplace/scripts/discover-v3-testnet-transfers.test.mjs contracts/marketplace/scripts/fetch-v3-testnet-history.test.mjs contracts/marketplace/scripts/audit-v3-historical-transfer.test.mjs
      - name: Syntax-check the production Testnet settlement attestor before any workflow release
        working-directory: .
        run: node --check contracts/marketplace/scripts/attest-v3-testnet-reserve-refund.mjs
      - name: Verify funded Testnet workflow safety gates
        working-directory: .
        run: node --test contracts/marketplace/scripts/verify-v3-funded-workflow-gates.test.mjs
      - name: Test V3 settlement attestation ABI and Ed25519 quorum model (reference only)
        working-directory: .
        run: node --test contracts/marketplace/experiments/v3-settlement-attestation.test.mjs
      - name: Run read-only Mainnet environment preflight unit tests
        working-directory: .
        run: node --test contracts/marketplace/scripts/preflight-v3-mainnet-environment.test.mjs
      - name: Setup Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e # v1.2.0
      - name: Compile V3 candidate and escrow without deploying
        run: acton build
      - name: Assert mainnet deploy script uses mainnet network and explicit wallet approval
        working-directory: .
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const source = readFileSync('contracts/marketplace/scripts/deploy-v3-mainnet.tolk','utf8');
          assert.match(source, /V3_MAINNET_DEPLOY_APPROVED/);
          assert.match(source, /V3_MAINNET_DEPLOYER_ADDRESS/);
          assert.match(source, /networkGlobalId: -239/);
          assert.match(source, /PLATFORM_TREASURY_ADDRESS/);
          assert.ok(source.includes('"verifierNetwork") == -239'));
          assert.match(source, /@wrappers\/NFTEscrowV2\.gen/);
          assert.doesNotMatch(source, /NFTEscrowV2Testnet/);
          assert.doesNotMatch(source, /V3_PRODUCTION_TESTNET_DEPLOY_APPROVED|networkGlobalId: -3[,\\s]/);
          console.log('Mainnet deployment source guards passed. This is NOT a transaction or deployment verification.');
          NODE
      - name: Run complete Marketplace V3 contract emulation suite
        run: acton test
      - name: Confirm build result
        run: |
          echo "Marketplace V3 candidate compiled on the selected commit." >> "$GITHUB_STEP_SUMMARY"
          echo "No wallet secret, transaction, or deployment was used." >> "$GITHUB_STEP_SUMMARY"
