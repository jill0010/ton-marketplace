name: Reserve Refund Prototype Tests (No Transactions)

on:
  pull_request:
    paths:
      - 'contracts/marketplace/experiments/reserve-refund-model.mjs'
      - 'contracts/marketplace/experiments/reserve-refund-model.test.mjs'
      - 'contracts/marketplace/experiments/v3-refund-reconciliation*.mjs'
      - 'contracts/marketplace/experiments/v3-toncenter-readonly*.mjs'
      - 'contracts/marketplace/experiments/v3-toncenter-candidates*.mjs'
      - '.github/workflows/reserve-refund-prototype-tests.yml'
      - 'contracts/marketplace/scripts/check-v3-mainnet-release-readiness*.mjs'
  push:
    paths:
      - 'contracts/marketplace/experiments/reserve-refund-model.mjs'
      - 'contracts/marketplace/experiments/reserve-refund-model.test.mjs'
      - 'contracts/marketplace/experiments/v3-refund-reconciliation*.mjs'
      - 'contracts/marketplace/experiments/v3-toncenter-readonly*.mjs'
      - 'contracts/marketplace/experiments/v3-toncenter-candidates*.mjs'
      - '.github/workflows/reserve-refund-prototype-tests.yml'
      - 'contracts/marketplace/scripts/check-v3-mainnet-release-readiness*.mjs'

permissions:
  contents: read

jobs:
  test:
    name: Test isolated reserve refund prototype
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22'
      - name: Run reserve-refund regression tests
        run: node --test contracts/marketplace/experiments/reserve-refund-model.test.mjs contracts/marketplace/scripts/check-v3-mainnet-release-readiness.test.mjs contracts/marketplace/experiments/v3-refund-reconciliation.test.mjs contracts/marketplace/experiments/v3-toncenter-readonly.test.mjs contracts/marketplace/experiments/v3-toncenter-candidates.test.mjs
