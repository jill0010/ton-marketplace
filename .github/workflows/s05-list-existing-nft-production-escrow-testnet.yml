name: S05 List Existing NFT to Production Escrow (Testnet Only)

on:
  workflow_dispatch:
    inputs:
      confirm_testnet_nft_transfer:
        description: "I approve ONE Testnet-only listing and NFT transfer to production Escrow; NO NFT deployment, purchase or mainnet"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: s05-existing-nft-43703734360
  cancel-in-progress: false

jobs:
  list-existing:
    if: ${{ inputs.confirm_testnet_nft_transfer == true && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: contracts/marketplace
    env:
      DEPLOYER_MNEMONIC: ${{ secrets.TESTNET_DEPLOYER_MNEMONIC }}
      SELLER_MNEMONIC: ${{ secrets.TESTNET_SELLER_MNEMONIC }}
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
      V3_TESTNET_DEPLOYER_ADDRESS: "0QDQEewIr69mGcq6uDIlAtibxW37gm7rJfKWru7o4_hSPbzu"
      PLATFORM_TREASURY_ADDRESS: "0QASRB4XGtN81Pwaef6fWnSJyRwwJEvbbPn-ksz0KQI-bFa0"
      S05_RECOVER_EXISTING_NFT_APPROVED: "true"
      S05_RECOVERY_NFT_ADDRESS: "kQDlwUeYOMs7XHVJaOoLrxvAcf_-Z740FsbUvppMoEXmaP9Q"
      V3_PRODUCTION_TESTNET_MARKETPLACE_ADDRESS: "kQB6a9pNVw_PEnuHW9FciV_ELODGXC-pWguu1xXnX4V-1njh"
      V3_PRODUCTION_TESTNET_ESCROW_ADDRESS: "kQAmmiCphiv-RewyM2dwTzzhY4cY0fjlUX0vpxqe-gUp-mtN"
    steps:
      - name: Checkout audited branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feature/reserve-refund-v3-audit
          persist-credentials: false
      - name: Guard against redeployment and purchase
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test -n "$DEPLOYER_MNEMONIC"
          test -n "$SELLER_MNEMONIC"
          test -n "$TONCENTER_API_KEY"
          grep -Fq 'import "list-v3-testnet-mock-nft-fixture"' scripts/list-s05-existing-nft-fixture.tolk
          ! grep -Eq 'deployV3TestnetMockNftFixture|sendBuyProductV2|--net mainnet' scripts/list-s05-existing-nft-fixture.tolk
          test "$S05_RECOVERY_NFT_ADDRESS" = "kQDlwUeYOMs7XHVJaOoLrxvAcf_-Z740FsbUvppMoEXmaP9Q"
      - name: Preflight testnet wallet funds
        run: node scripts/preflight-v3-testnet-funding.mjs
      - name: Setup Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e
      - name: Configure testnet wallets
        shell: bash
        run: |
          set -euo pipefail
          cat > wallets.toml <<'WALLETS'
          [wallets.deployer]
          kind = "v5r1"
          workchain = 0
          keys = { mnemonic-env = "DEPLOYER_MNEMONIC" }

          [wallets.treasury]
          kind = "v5r1"
          mnemonic-scheme = "bip39"
          workchain = 0
          keys = { mnemonic-env = "SELLER_MNEMONIC" }
          WALLETS
          chmod 600 wallets.toml
          acton script scripts/check-v3-production-testnet-wallets.tolk --net testnet
      - name: Build and list existing NFT to production escrow
        shell: bash
        run: |
          set -euo pipefail
          acton build
          acton script scripts/list-s05-existing-nft-fixture.tolk --net testnet 2>&1 | tee s05-existing-nft-custody.log
          grep -Fq "S05_RECOVERED_NFT_CUSTODY_VERIFIED:" s05-existing-nft-custody.log
      - name: Preserve custody evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s05-existing-nft-custody-${{ github.run_id }}
          path: contracts/marketplace/s05-existing-nft-custody.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove wallets
        if: always()
        run: rm -f wallets.toml
