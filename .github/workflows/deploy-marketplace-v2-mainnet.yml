name: Marketplace V2 Mainnet Preflight (No Transactions)

on:
  workflow_dispatch:
    inputs:
      confirm_mainnet_preflight:
        description: "Run the read-only Mainnet release checks. This workflow does not deploy contracts or broadcast transactions."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: marketplace-v2-mainnet-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy fresh Marketplace V2 and NFT Escrow V2
    if: ${{ inputs.confirm_mainnet_preflight == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts/marketplace
    env:
      PLATFORM_TREASURY_ADDRESS: ${{ secrets.PLATFORM_TREASURY_ADDRESS }}
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_MAINNET_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e # v1.2.0

      - name: Validate public release configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PLATFORM_TREASURY_ADDRESS}" || { echo "::error::Missing PLATFORM_TREASURY_ADDRESS repository secret"; exit 1; }
          test -n "${TONCENTER_API_KEY}" || { echo "::error::Missing TONCENTER_MAINNET_API_KEY repository secret"; exit 1; }

      - name: Check opcode registry
        run: node scripts/check-opcode-registry.mjs

      - name: Check Fragment NFT Item code policy
        run: node scripts/check-fragment-item-code-policy.mjs

      - name: Build production contracts
        run: acton build

      - name: Run complete emulator test suite
        run: acton test --backtrace full

      - name: Exercise V2 deployment script in emulator
        run: acton script scripts/deploy-v2.tolk

      - name: Linter
        run: acton check --output-format github

      - name: Formatter
        run: acton fmt --check

      - name: Recheck official Fragment NFT libraries on Mainnet (read-only)
        run: node scripts/check-mainnet-fragment-libraries.mjs

      - name: Publish preflight summary
        shell: bash
        run: |
          {
            echo "## Marketplace V2 Mainnet preflight"
            echo
            echo "- Contract build, emulator tests, lint and format checks passed."
            echo "- Official Fragment Mainnet library availability was checked read-only."
            echo "- No wallet seed phrase was loaded by this workflow."
            echo "- No mainnet transaction was signed or broadcast."
            echo
            echo "Actual deployment must be initiated separately with the interactive TON Connect signer:"
            echo '  acton script scripts/deploy-v2.tolk --net mainnet --tonconnect'
            echo
            echo "Public customer purchases must remain disabled until the frontend flow, collection allowlist, and reserve policy are approved."
          } >> "$GITHUB_STEP_SUMMARY"
