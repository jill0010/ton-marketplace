name: Deploy Marketplace V2 Mainnet

on:
  workflow_dispatch:
    inputs:
      confirm_mainnet_deployment:
        description: "I understand this broadcasts irreversible TON mainnet transactions and spends mainnet TON for deployment fees."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: marketplace-v2-mainnet-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy fresh Marketplace V2 and NFT Escrow V2
    if: ${{ inputs.confirm_mainnet_deployment == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts/marketplace
    env:
      DEPLOYER_MNEMONIC: ${{ secrets.DEPLOYER_MNEMONIC }}
      PLATFORM_TREASURY_ADDRESS: ${{ secrets.PLATFORM_TREASURY_ADDRESS }}
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_MAINNET_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e # v1.2.0

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOYER_MNEMONIC}" || { echo "::error::Missing DEPLOYER_MNEMONIC repository secret"; exit 1; }
          test -n "${PLATFORM_TREASURY_ADDRESS}" || { echo "::error::Missing PLATFORM_TREASURY_ADDRESS repository secret"; exit 1; }
          test -n "${TONCENTER_API_KEY}" || { echo "::error::Missing TONCENTER_MAINNET_API_KEY repository secret"; exit 1; }
          cat > wallets.toml <<'WALLETS'
          [wallets.deployer]
          kind = "v5r1"
          workchain = 0
          keys = { mnemonic-env = "DEPLOYER_MNEMONIC" }
          WALLETS
          chmod 600 wallets.toml

      - name: Check opcode registry
        run: node scripts/check-opcode-registry.mjs

      - name: Check Fragment NFT Item code policy
        run: node scripts/check-fragment-item-code-policy.mjs

      - name: Build production contracts
        run: acton build

      - name: Run complete emulator test suite
        run: acton test --backtrace full

      - name: Exercise V2 deployment script in emulator
        run: acton script scripts/deploy-v2.tolk

      - name: Linter
        run: acton check --output-format github

      - name: Formatter
        run: acton fmt --check

      - name: Recheck official Fragment NFT libraries on Mainnet (read-only)
        run: node scripts/check-mainnet-fragment-libraries.mjs

      - name: Deploy and verify on TON Mainnet
        shell: bash
        run: |
          set -euo pipefail
          acton script scripts/deploy-v2.tolk --net mainnet 2>&1 | tee mainnet-deployment.log
          grep -Fq "Escrow binding and immutable treasury configuration verified" mainnet-deployment.log
          {
            echo "## TON Mainnet deployment"
            echo
            grep -E "Marketplace V2 deployed at|NFT Escrow V2 deployed at|Marketplace owner:|Platform treasury:" mainnet-deployment.log
            echo
            echo "The deployment script verified Marketplace/Escrow binding and the immutable treasury getter."
          } >> "$GITHUB_STEP_SUMMARY"
